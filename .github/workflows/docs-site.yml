name: Documentation website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/build_docs_site.py'
      - '.github/workflows/docs-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/build_docs_site.py'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Markdown renderer
        run: python -m pip install "Markdown==3.8.2"
      - name: Build and validate documentation
        run: |
          python scripts/build_docs_site.py
          test -s docs-site/_site/index.html
          test -s docs-site/_site/docs/quickstart/index.html
          test -s docs-site/_site/docs/installation/index.html
          test -s docs-site/_site/docs/guides/agent-skills/index.html
          test -s docs-site/_site/docs/guides/authoring/index.html
          python -m compileall -q scripts/build_docs_site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
