name: Renderer presets WASM gofmt one-shot
on:
  push:
    branches: [feat/renderer-presets-unified]
    paths:
      - .github/workflows/renderer-presets-wasm-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/renderer-presets-unified
          persist-credentials: true
      - name: Format WASM Go and delete one-time action
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/markata-wasm/main.go pkg/config/renderer_defaults_validate.go pkg/plugins/standalone_profile.go
          git rm -- .github/workflows/renderer-presets-wasm-gofmt.yml
          git add -- cmd/markata-wasm/main.go pkg/config/renderer_defaults_validate.go pkg/plugins/standalone_profile.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(renderer): format WASM config adapter'
          git push origin HEAD:feat/renderer-presets-unified
