name: Theme controls browser regressions

on:
  pull_request:
    paths:
      - "pkg/plugins/palette_css.go"
      - "pkg/themes/default/templates/partials/theme-controls-loader.html"
      - "pkg/themes/default/templates/base.html"
      - "templates/base.html"
      - "pkg/themes/default/static/js/palette-switcher.js"
      - "scripts/theme-controls.browser.test.cjs"
      - ".github/workflows/theme-controls-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate and exercise theme controls
        run: |
          node --check pkg/themes/default/static/js/palette-switcher.js
          node --check scripts/theme-controls.browser.test.cjs
          node --test scripts/theme-controls.browser.test.cjs
