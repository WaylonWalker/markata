# One-shot release bootstrap. Lives only on the dedicated release-trigger branch.
# The audited and CI/snapshot-tested v0.14.0 source tree is frozen at the SHA below.
name: One-shot Markata v0.14.0 release bootstrap

on:
  push:
    branches:
      - release-trigger/v0.14.0

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Tag tested commit and dispatch signed release/image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check immutable release source and existing tag
        env:
          RELEASE_SHA: 7ace8550b726151cb2b80b5d60bb68b551880f61
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test -f docs/releases/v0.14.0.md
          test -f .github/workflows/release.yml
          if git show-ref --verify --quiet refs/tags/v0.14.0; then
            actual="$(git rev-parse 'refs/tags/v0.14.0^{commit}')"
            test "$actual" = "$RELEASE_SHA" || { echo 'v0.14.0 already tags a DIFFERENT commit' >&2; exit 1; }
          fi
      - name: Create annotated version tag only when missing
        env:
          RELEASE_SHA: 7ace8550b726151cb2b80b5d60bb68b551880f61
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet refs/tags/v0.14.0; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.14.0 "$RELEASE_SHA" -m 'Markata v0.14.0'
            git push origin refs/tags/v0.14.0
          fi
      - name: Trigger release and tag-specific container publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN-created tags do not fire push workflows automatically.
          # The release workflow has an explicit guarded workflow_dispatch trigger.
          gh workflow run release.yml --ref v0.14.0
          gh workflow run docker.yml --ref v0.14.0
          echo 'Release and Docker jobs dispatched. Verify their results and artifacts before rolling out GitOps.'
