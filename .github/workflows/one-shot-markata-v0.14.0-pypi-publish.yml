name: One-shot Markata v0.14.0 PyPI publish dispatch

on:
  push:
    branches:
      - release-trigger/v0.14.0-pypi-publish

permissions:
  contents: read
  actions: write

jobs:
  dispatch-pypi:
    if: github.repository == 'WaylonWalker/markata'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check immutable release source and unpublished PyPI version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api repos/WaylonWalker/markata/commits/main --jq .sha)"
          test "$current" = "7ace8550b726151cb2b80b5d60bb68b551880f61" || {
            echo "::error::main moved since approved v0.14.0 wheel dry-run"; exit 1;
          }
          status="$(curl --retry 2 --silent --location --output /dev/null --write-out '%{http_code}' 'https://pypi.org/pypi/markata/0.14.0/json')"
          test "$status" = 404 || {
            echo "::error::PyPI 0.14.0 already exists, or PyPI unavailable (HTTP $status)"; exit 1;
          }
      - name: Publish only through guarded canonical wheel workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pypi-go-wheels.yml --repo WaylonWalker/markata --ref main \
            --field version=0.14.0 \
            --field publish=true \
            --field confirm=REPLACE_PYTHON_MARKATA_WITH_GO
          echo 'Dispatched guarded PyPI publishing workflow on main at audited v0.14.0 source.'
