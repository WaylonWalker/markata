name: D2 native Go 1.26 compatibility spike

on:
  pull_request:
    paths:
      - 'benchmarks/d2-native/**'
      - '.github/workflows/d2-native-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-d2:
    name: Native D2 / Go 1.26 SVG benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: benchmarks/d2-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Resolve only isolated D2 dependencies
        run: go mod tidy
      - name: Check native D2 SVG output with race detector
        run: go test -race -v -run '^TestNativeD2SVG$' -timeout=12m ./...
      - name: Measure warm native D2 render and font payload
        run: |
          go test -run '^$' -bench '^BenchmarkNativeD2' -benchmem -benchtime=200ms -count=3 -timeout=12m ./... | tee native-d2-benchmark.txt
          echo '### Native D2 Go 1.26 compatibility and SVG benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          cat native-d2-benchmark.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Download and verify pinned D2 v0.9.0 CLI
        run: |
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/d2-v0.9.0-linux-amd64.tar.gz" \
            https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/SHA256SUMS" \
            https://github.com/d2lang/d2/releases/download/v0.9.0/SHA256SUMS
          cd "$RUNNER_TEMP"
          grep 'd2-v0.9.0-linux-amd64.tar.gz' SHA256SUMS | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/d2-extract"
          tar -xzf "$RUNNER_TEMP/d2-v0.9.0-linux-amd64.tar.gz" -C "$RUNNER_TEMP/d2-extract"
          d2_binary=$(find "$RUNNER_TEMP/d2-extract" -type f -name d2 -print -quit)
          test -n "$d2_binary"
          chmod +x "$d2_binary"
          printf 'D2_CLI=%s\n' "$d2_binary" >> "$GITHUB_ENV"
      - name: Compare newest D2 CLI process latency and SVG bytes
        run: python3 compare_cli.py "$D2_CLI"
