name: One-shot Markata v0.14.0 PyPI dry-run
on:
  push:
    branches: [release-trigger/v0.14.0-pypi-smoke]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build Go platform wheels without any upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pypi-go-wheels.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field version=0.14.0 --field publish=false
          echo 'Dry-run dispatched; no PyPI publication requested.'
