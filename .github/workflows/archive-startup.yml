name: Archive startup browser regressions

on:
  pull_request:
    paths:
      - "pkg/themes/default/static/css/feeds.css"
      - "pkg/themes/default/static/css/main.css"
      - "pkg/themes/default/static/css/components.css"
      - "pkg/themes/default/static/css/search.css"
      - "pkg/themes/default/static/js/conditional-css.js"
      - "pkg/themes/default/static/js/navigation-shortcuts.js"
      - "pkg/themes/default/static/js/view-transitions.js"
      - "pkg/themes/default/static/js/sidebar-rescue.js"
      - "pkg/themes/default/static/js/fit-post-titles.js"
      - "pkg/themes/default/static/js/heading-highlights.js"
      - "scripts/font-startup.browser.test.cjs"
      - "pkg/themes/default/templates/base.html"
      - "templates/base.html"
      - "pkg/themes/default/templates/partials/theme-bootstrap.html"
      - "templates/partials/theme-bootstrap.html"
      - "scripts/drawer-startup.browser.test.cjs"
      - "scripts/drawer-rendering.browser.test.cjs"
      - "scripts/sidebar-rescue.browser.test.cjs"
      - "scripts/archive-startup.browser.test.cjs"
      - "scripts/admonition-contrast.browser.test.cjs"
      - "scripts/markdown-metrics.browser.test.cjs"
      - "scripts/navbar-search-layout.browser.test.cjs"
      - ".github/workflows/archive-startup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Check archive startup and progressive rendering
        run: |
          node --check pkg/themes/default/static/js/navigation-shortcuts.js
          node --check scripts/archive-startup.browser.test.cjs
          node --check scripts/admonition-contrast.browser.test.cjs
          node --check scripts/markdown-metrics.browser.test.cjs
          node --check pkg/themes/default/static/js/sidebar-rescue.js
          node --test scripts/archive-startup.browser.test.cjs scripts/admonition-contrast.browser.test.cjs scripts/markdown-metrics.browser.test.cjs scripts/navbar-search-layout.browser.test.cjs scripts/drawer-startup.browser.test.cjs scripts/drawer-rendering.browser.test.cjs scripts/sidebar-rescue.browser.test.cjs scripts/font-startup.browser.test.cjs
