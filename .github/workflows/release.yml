# Release workflow for markata-go
# Triggers on version tags (v*)

name: Release

on:
  push:
    tags:
      - "v*"
  # Dispatch on a verified tag when a release agent created the tag with GITHUB_TOKEN.
  # GitHub suppresses push-triggered workflows for GITHUB_TOKEN-created tags.
  workflow_dispatch:

# Tag pushes and manual dispatches can target the same release. Queue duplicates
# instead of racing GoReleaser or cancelling a publisher midway through uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write  # For cosign signing

env:
  GO_VERSION: "1.27"

jobs:
  # Run tests before releasing
  test:
    name: Test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  # The exact release tag must pass native Windows/macOS tests before
  # GoReleaser publishes assets. A prior green main-branch run is insufficient.
  test-nonlinux:
    name: Release tests (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run full native platform tests
        run: go test -v ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, test-nonlinux]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft (for SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 30
