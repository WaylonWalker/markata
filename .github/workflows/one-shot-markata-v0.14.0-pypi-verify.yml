name: One-shot Markata v0.14.0 public PyPI verification

on:
  push:
    branches:
      - release-verify/markata-v0.14.0-pypi

permissions:
  contents: read

jobs:
  pypi-public-install:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Independently fetch public PyPI JSON and check eight wheel releases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url = 'https://pypi.org/pypi/markata/0.14.0/json'
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          names = [x['filename'] for x in data['urls']]
          wheels = [n for n in names if n.endswith('.whl')]
          assert data['info']['name'].lower() == 'markata', data['info']['name']
          assert data['info']['version'] == '0.14.0', data['info']['version']
          assert len(wheels) == 8, (len(wheels), wheels)
          for os in ('manylinux', 'musllinux', 'macosx', 'win'):
              assert any(os in wheel for wheel in wheels), (os, wheels)
          print('PUBLIC PYPI VERIFIED: markata 0.14.0 has eight wheels')
          for file in wheels: print(file)
          PY
      - name: Fresh Python environment installs and runs real PyPI Go wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/pypi-0.14.0-clean"
          py="${RUNNER_TEMP}/pypi-0.14.0-clean/bin/python"
          "${py}" -m pip install --no-cache-dir --only-binary=:all: 'markata==0.14.0'
          "${py}" -m markata version
          "${py}" -m markata --help
          "${RUNNER_TEMP}/pypi-0.14.0-clean/bin/markata" version
