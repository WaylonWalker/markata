# CI workflow for markata-go
# Runs on main/master pushes and pull requests, daily, and on demand

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  LINT_GO_VERSION: "1.27"

jobs:
  changes:
    name: Specialized check inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fonts: ${{ steps.filter.outputs.fonts }}
      rendering: ${{ steps.filter.outputs.rendering }}
      helm: ${{ steps.filter.outputs.helm }}
      goreleaser: ${{ steps.filter.outputs.goreleaser }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect changed inputs
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          # PRs use the changed-files API (also for forks). Pushes compare
          # against the previous commit, not main against itself.
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          filters: |
            fonts:
              - '.github/workflows/**'
              - 'scripts/generate_font_manifests.py'
              - 'internal/fontcatalog/**'
              - 'vendor/google-fonts/**'
            rendering:
              - '.github/workflows/**'
              - 'scripts/rendering-contract/**'
              - 'spec/rendering-contract/**'
              - 'pkg/renderingcontract/**'
              - 'pkg/palettes/**'
              - 'palettes/**'
              - 'go.mod'
              - 'go.sum'
            helm:
              - '.github/workflows/**'
              - 'helm-chart/**'
            goreleaser:
              - '.github/workflows/**'
              - '.goreleaser.yml'
              - 'go.mod'
              - 'go.sum'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.LINT_GO_VERSION }}
          cache: true
      - name: Run golangci-lint
        # Match just lint: v1 releases do not use the /v2 module path.
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout=5m

  manifest-completeness:
    name: Font Manifest Completeness
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.fonts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check bundled manifests
        run: ./scripts/generate_font_manifests.py --completeness

  manifest-generation:
    name: Font Manifest Determinism
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.fonts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Fetch pinned Google Fonts sources
        env:
          GOOGLE_FONTS: vendor/google-fonts
        run: |
          revision=$(uv run --with pyyaml python -c 'import yaml; print(yaml.safe_load(open("internal/fontcatalog/markata-fonts.lock.yaml"))["revision"])')
          directories=$(uv run --with pyyaml python -c 'import yaml; lock=yaml.safe_load(open("internal/fontcatalog/markata-fonts.lock.yaml")); print("\n".join(sorted({source["directory"] for source in lock["sources"].values()})))')
          mkdir -p "$GOOGLE_FONTS"
          git -C "$GOOGLE_FONTS" init
          git -C "$GOOGLE_FONTS" remote add origin https://github.com/google/fonts.git
          git -C "$GOOGLE_FONTS" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$GOOGLE_FONTS" sparse-checkout init --cone
          git -C "$GOOGLE_FONTS" sparse-checkout set --stdin <<< "$directories"
          git -C "$GOOGLE_FONTS" checkout --detach FETCH_HEAD
      - name: Regenerate and compare manifests from pinned source
        run: ./scripts/generate_font_manifests.py --check

  rendering-contract:
    name: Rendering Contract
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rendering == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check generated rendering contract artifacts
        run: go run ./scripts/rendering-contract --check

  helm-chart:
    name: Helm Chart
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint Helm chart
        run: helm lint helm-chart
      - name: Test nginx CORS behavior
        run: ./helm-chart/tests/nginx-cors.sh

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        go: ["1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests (windows short)
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'windows-latest'
        run: go test -v -short ./...
      - name: Run tests (macOS short)
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'macos-latest'
        run: go test -v -short ./...
      - name: Run tests (non-linux full)
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: go test -v ./...

  test-linux-core:
    name: Linux tests (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build test CLI
        run: |
          start=$SECONDS
          go build -ldflags="-s -w" -o "$RUNNER_TEMP/markata-go" ./cmd/markata-go
          printf 'MARKATA_GO_TEST_BINARY=%s\n' "$RUNNER_TEMP/markata-go" >> "$GITHUB_ENV"
          printf 'MARKATA_GO_TEST_BINARY_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CLI build: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run core tests (race + coverage)
        run: |
          start=$SECONDS
          go list ./... > "$RUNNER_TEMP/all-packages.txt"
          mapfile -t all_packages < "$RUNNER_TEMP/all-packages.txt"
          # Fail visibly if the module name changes again: otherwise these
          # test packages would silently fall into the core shard as duplicates.
          expected_exclusions=(
            github.com/WaylonWalker/markata/cmd/markata-go/cmd
            github.com/WaylonWalker/markata/pkg/search
            github.com/WaylonWalker/markata/pkg/searchapi
            github.com/WaylonWalker/markata/tests
          )
          for excluded in "${expected_exclusions[@]}"; do
            if ! grep -Fxq "$excluded" "$RUNNER_TEMP/all-packages.txt"; then
              printf 'Expected package missing from CI shard exclusions: %s\n' "$excluded" >&2
              exit 1
            fi
          done
          packages=()
          for package in "${all_packages[@]}"; do
            case "$package" in
              github.com/WaylonWalker/markata/cmd/markata-go/cmd|github.com/WaylonWalker/markata/pkg/search|github.com/WaylonWalker/markata/pkg/searchapi|github.com/WaylonWalker/markata/tests) continue ;;
            esac
            packages+=("$package")
          done
          [[ ${#packages[@]} -gt 0 ]] || { echo "No core Go test packages were selected" >&2; exit 1; }
          go test -v -race -timeout=30m -coverprofile=coverage-core.out -covermode=atomic "${packages[@]}"
          echo "Core race + coverage: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage-core.out
          fail_ci_if_error: false

  test-linux-cli:
    name: Linux tests (CLI and search)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build test CLI
        run: |
          start=$SECONDS
          go build -ldflags="-s -w" -o "$RUNNER_TEMP/markata-go" ./cmd/markata-go
          printf 'MARKATA_GO_TEST_BINARY=%s\n' "$RUNNER_TEMP/markata-go" >> "$GITHUB_ENV"
          printf 'MARKATA_GO_TEST_BINARY_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CLI build: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify binary
        run: |
          "$MARKATA_GO_TEST_BINARY" version
          "$MARKATA_GO_TEST_BINARY" --help
      - name: Run CLI and search tests (race + coverage, excluding observational Build Lab)
        if: github.event_name == 'pull_request'
        run: |
          start=$SECONDS
          go test -v -race -timeout=30m -coverprofile=coverage-cli.out -covermode=atomic -skip '^TestBuildLab_LinkedAndFixtureMutationsCharacterizeProduct$' ./cmd/markata-go/cmd ./pkg/search ./pkg/searchapi
          echo "CLI/search race + coverage: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run CLI and search tests (race + coverage)
        if: github.event_name != 'pull_request'
        run: |
          start=$SECONDS
          go test -v -race -timeout=30m -coverprofile=coverage-cli.out -covermode=atomic ./cmd/markata-go/cmd ./pkg/search ./pkg/searchapi
          echo "CLI/search race + coverage: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage-cli.out
          fail_ci_if_error: false

  test-linux-site:
    name: Linux tests (site integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build test CLI
        run: |
          start=$SECONDS
          go build -ldflags="-s -w" -o "$RUNNER_TEMP/markata-go" ./cmd/markata-go
          printf 'MARKATA_GO_TEST_BINARY=%s\n' "$RUNNER_TEMP/markata-go" >> "$GITHUB_ENV"
          printf 'MARKATA_GO_TEST_BINARY_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CLI build: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run site integration tests (race + coverage)
        run: |
          start=$SECONDS
          go test -v -race -timeout=30m -coverprofile=coverage-site.out -covermode=atomic ./tests
          echo "Site integration race + coverage: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage-site.out
          fail_ci_if_error: false

  test-linux:
    name: Test (ubuntu-latest, 1.27)
    runs-on: ubuntu-latest
    if: always()
    needs: [test-linux-core, test-linux-cli, test-linux-site]
    steps:
      - name: Check Linux test shards
        env:
          CORE_RESULT: ${{ needs.test-linux-core.result }}
          CLI_RESULT: ${{ needs.test-linux-cli.result }}
          SITE_RESULT: ${{ needs.test-linux-site.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" || "$CLI_RESULT" != "success" || "$SITE_RESULT" != "success" ]]; then
            printf 'Linux test shards failed: core=%s cli=%s site=%s\n' "$CORE_RESULT" "$CLI_RESULT" "$SITE_RESULT" >&2
            exit 1
          fi
          echo "All Linux race and coverage test shards passed"

  goreleaser-check:
    name: GoReleaser Check
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.goreleaser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Test canonical and legacy install paths
        run: |
          bash -n install.sh
          bash scripts/test-install-identity.sh
      - name: Build and inspect both CLI identities
        run: |
          go build -o "$RUNNER_TEMP/markata" ./cmd/markata
          go build -o "$RUNNER_TEMP/markata-go" ./cmd/markata-go
          "$RUNNER_TEMP/markata" version | grep -q '^markata '
          "$RUNNER_TEMP/markata-go" version | grep -q '^markata-go '
          "$RUNNER_TEMP/markata" --help | grep -q 'markata build'
