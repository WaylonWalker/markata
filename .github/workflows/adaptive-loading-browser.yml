name: Adaptive video autoplay browser tests

on:
  pull_request:
    paths:
      - "pkg/models/config.go"
      - "pkg/plugins/md_video.go"
      - "pkg/plugins/md_video_test.go"
      - "pkg/themes/default/static/js/adaptive-loading.js"
      - "pkg/themes/default/templates/partials/adaptive-loading.html"
      - "templates/partials/adaptive-loading.html"
      - "scripts/adaptive-loading.test.cjs"
      - "scripts/adaptive-loading.browser.test.cjs"
      - "scripts/fixtures/adaptive-video.webm"
      - ".github/workflows/adaptive-loading-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run autoplay policy and browser regressions
        run: |
          node --check pkg/themes/default/static/js/adaptive-loading.js
          node --check scripts/adaptive-loading.test.cjs
          node --check scripts/adaptive-loading.browser.test.cjs
          node --test scripts/adaptive-loading.test.cjs scripts/adaptive-loading.browser.test.cjs
