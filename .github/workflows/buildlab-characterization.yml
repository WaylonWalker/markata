name: Build Lab characterization

on:
  # Main pushes and daily CI already include this observation in the CLI suite.
  # Keep a focused manual entrypoint without duplicating daily or PR runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  characterize:
    name: Observe Build Lab mutations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run observational Build Lab characterization
        run: go test -v -race -timeout=30m ./cmd/markata-go/cmd -run '^TestBuildLab_LinkedAndFixtureMutationsCharacterizeProduct$'
