name: Editor Private Read HTTP

on:
  pull_request:
    paths:
      - 'pkg/editorhub/private_read_http*.go'
      - '.github/workflows/editor-private-read-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-read-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check private read handler formatting
        run: |
          if [ -n "$(gofmt -l pkg/editorhub/private_read_http*.go)" ]; then
            gofmt -d pkg/editorhub/private_read_http*.go
            exit 1
          fi
      - name: Vet private read handler
        run: go vet ./pkg/editorhub ./pkg/editorsync
      - name: Run race-enabled private read and SQLite tests
        run: go test -race -count=1 ./pkg/editorhub ./pkg/editorsync
