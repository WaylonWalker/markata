# Temporary, self-removing maintenance helper for PR #2081.
# The standalone FastAPI demo embeds a multi-megabyte, generated ZIP in a
# single Python line, which must be regenerated from the canonical assets.
name: Refresh PR 2081 embedded Python editor assets
on:
  push:
    branches: [better]
    paths:
      - .github/workflows/refresh-python-editor-assets-2081.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'WaylonWalker/markata'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate self-contained Python editor bundle
        run: python3 scripts/package-python-editor-assets.py
      - name: Commit generated Python editor bundle to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- examples/fastapi_editor.py; then
            echo "Bundled Python editor assets already match source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/fastapi_editor.py
          git commit -m "fix(editor): synchronize generated Python Excalidraw assets"
          git push origin HEAD:better
