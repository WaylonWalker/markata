name: Shortcuts modal browser acceptance

on:
  pull_request:
    paths:
      - "templates/partials/shortcuts-modal.html"
      - "pkg/themes/default/templates/partials/shortcuts-modal.html"
      - "pkg/themes/default/static/js/search-shortcuts.js"
      - "pkg/themes/default/static/js/shortcuts-registry.js"
      - "scripts/shortcuts-modal.browser.test.cjs"
      - ".github/workflows/shortcuts-modal-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortcuts-dialog:
    name: No-JS visibility and keyboard focus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify shipped shortcuts templates and JavaScript
        run: |
          node --check scripts/shortcuts-modal.browser.test.cjs
          node scripts/shortcuts-modal.browser.test.cjs
