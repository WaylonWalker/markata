# Auto-merge normal Dependabot version-update PRs once required CI passes.
#
# Policy:
# - Auto-merge Dependabot PRs that are NOT associated with an open security alert.
# - Let GitHub auto-merge wait for required branch-protection checks.
# - Security/vulnerability PRs should be reviewed manually.
#
# Requirements:
# - Repository Settings → Pull Requests → Allow auto-merge
# - Branch protection on main with required CI checks

name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  security-events: read

jobs:
  dependabot-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true

      # GitHub auto-merge can merge immediately when no required checks are configured.
      # Fail closed instead of depending on a comment saying branch protection is required.
      - name: Verify required CI gates are configured
        if: steps.metadata.outputs.alert-state != 'OPEN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Classic branch-protection read may require Administration:read, which the
          # workflow token cannot request. Active branch rulesets are readable with
          # Metadata:read; check both and fail closed if neither exposes the gates.
          protection="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks" 2>/dev/null || true)"
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" 2>/dev/null || true)"
          required_names="$(
            {
              if [[ -n "$protection" ]]; then
                jq -r '.checks[]?.context, .contexts[]?' <<< "$protection"
              fi
              if [[ -n "$rules" ]]; then
                jq -r '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context' <<< "$rules"
              fi
            } | sort -u
          )"
          if [[ -z "$required_names" ]]; then
            echo "::error::Cannot find required status checks for main. Configure a required-status-checks branch ruleset before Dependabot auto-merge."
            exit 1
          fi
          required_checks=(
            "Lint"
            "Test (ubuntu-latest, 1.27)"
            "Test (windows-latest, 1.27)"
            "Test (macos-latest, 1.27)"
            "GoReleaser Check"
          )
          for check in "${required_checks[@]}"; do
            if ! grep -Fxq -- "$check" <<< "$required_names"; then
              echo "::error::Missing required branch-protection check: $check. Refusing early auto-merge."
              exit 1
            fi
          done

      - name: Enable auto-merge for non-security Dependabot updates
        if: steps.metadata.outputs.alert-state != 'OPEN'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
