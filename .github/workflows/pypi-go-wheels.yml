name: Go Markata PyPI wheels

# PRs validate wheels without publishing. A successful GitHub Release workflow
# automatically publishes the same verified tag to PyPI via trusted OIDC.
# Manual dispatch remains available for recovering a missed tagged release.
on:
  pull_request:
    paths:
      - '.github/workflows/pypi-go-wheels.yml'
      - 'scripts/build-pypi-wheels.sh'
      - 'scripts/check-pypi-wheels.py'
      - 'scripts/add-python-renderer-to-wheels.py'
      - 'python/**'
      - 'docs/guides/python-renderer.md'
      - 'pkg/plugins/standalone*'
      - 'pkg/renderprotocol/**'
      - 'pkg/plugins/icons*'
      - 'pkg/themes/**'
      - 'pkg/templates/**'
      - 'pkg/palettes/**'
      - 'pkg/aesthetic/**'
      - 'pkg/fontpacks/**'
      - 'examples/fastapi_editor.py'
      - 'examples/command-palette-showcase.md'
      - 'examples/wasm-workbench/**'
      - 'pkg/workbench/**'
      - 'pkg/lsp/**'
      - 'tests/editors/**'
      - 'scripts/wasm-workbench.py'
      - 'docs/guides/fastapi-editor.md'
      - 'cmd/markata/**'
      - 'cmd/markata-go/**'
      - 'go.mod'
      - 'go.sum'
  # GITHUB_TOKEN-created releases do not emit an automatic release event.
  # workflow_run observes the completed Release workflow on the default branch.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing stable GitHub release version to publish/reconcile on PyPI'
        required: true
        type: string
        default: '0.15.0'

concurrency:
  # A publish must not be cancelled halfway through or race another upload.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.version || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-source:
    name: Verify version, GitHub release and existing PyPI state
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v0.'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      already_published: ${{ steps.source.outputs.already_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, release artifacts and PyPI state
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "version=0.14.0.dev0" >> "$GITHUB_OUTPUT"
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual publishing must be dispatched from main" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            tag="$RELEASE_BRANCH"
          else
            tag="v${REQUESTED_VERSION}"
          fi
          if [[ ! "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected stable 0.x.y release tag, got $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [[ "$EVENT_NAME" == "workflow_run" && "$RELEASE_SHA" != "$tag_sha" ]]; then
            echo "Release workflow SHA does not match $tag (possible moved tag)" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" |
            jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .prerelease == false and ([.assets[].name] | index("checksums.txt") != null)' >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_sha" >> "$GITHUB_OUTPUT"
          # Re-running successful releases must not overwrite immutable PyPI files.
          python - "$version" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request
          version, output = sys.argv[1:]
          url = f"https://pypi.org/pypi/markata/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              existing = None
          published = False
          if existing:
              wheels = [file["filename"] for file in existing.get("urls", []) if file["filename"].endswith(".whl")]
              if len(wheels) != 8 or any(not name.startswith(f"markata-{version}-") for name in wheels):
                  raise SystemExit(f"PyPI {version} exists but does not have the expected eight wheels: {wheels}")
              published = True
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"already_published={str(published).lower()}\n")
          print(f"Validated {version}; already published: {published}")
          PY

  wheels:
    name: Build and verify eight Go wheels
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MARKATA_WHEEL_VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      # Build the exact validated release commit rather than mutable main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-source.outputs.commit }}
          persist-credentials: false
      - name: Confirm verified source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-source.outputs.commit }}"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Simon Willison's go-to-wheel
        run: python -m pip install go-to-wheel==0.2
      - name: Test persistent Go render protocol and CLI (when present in tag)
        run: |
          # v0.15.0 predates pkg/renderprotocol; do not fail on a future test's absent directory.
          if [[ -d pkg/renderprotocol ]]; then
            go test ./pkg/renderprotocol -count=1
          fi
          go test ./cmd/markata-go/cmd -run '^TestRenderCommand_' -count=1
      - name: Test Python renderer protocol and wheel packaging
        run: python -m unittest discover -s python/tests -v
      - name: Build Go command into PyPI wheel artifacts (no upload)
        run: bash scripts/build-pypi-wheels.sh "${MARKATA_WHEEL_VERSION}"
      - name: Verify platform wheel tags, Go binaries and metadata
        run: python scripts/check-pypi-wheels.py dist/pypi-wheels
      - name: Install and execute wheel in a clean Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/markata-wheel-venv"
          wheel="dist/pypi-wheels/markata-${MARKATA_WHEEL_VERSION}-py3-none-manylinux_2_17_x86_64.whl"
          "${RUNNER_TEMP}/markata-wheel-venv/bin/python" -m pip install --no-deps --no-index "${wheel}"
          "${RUNNER_TEMP}/markata-wheel-venv/bin/python" python/smoke_renderer.py
          "${RUNNER_TEMP}/markata-wheel-venv/bin/python" -m markata version
          "${RUNNER_TEMP}/markata-wheel-venv/bin/markata" version
          "${RUNNER_TEMP}/markata-wheel-venv/bin/markata" --help
          "${RUNNER_TEMP}/markata-wheel-venv/bin/python" -m pip install fastapi httpx uvicorn websockets playwright
          "${RUNNER_TEMP}/markata-wheel-venv/bin/python" python/smoke_fastapi.py
          "${RUNNER_TEMP}/markata-wheel-venv/bin/python" -m unittest discover -s python/integration -v
      - name: Save inspected wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: markata-go-pypi-wheels
          path: dist/pypi-wheels/*.whl
          if-no-files-found: error
          retention-days: 7

  editor-parity:
    name: Editor parity (Python, Go, WASM)
    needs: [release-source, wheels]
    # v0.15.0 predates the added browser parity gate; PRs still execute it.
    if: github.event_name == 'pull_request' || needs.release-source.outputs.version != '0.15.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARKATA_WHEEL_VERSION: ${{ needs.release-source.outputs.version }}
      MARKATA_BROWSER_ARTIFACTS: .markata-browser-artifacts
    steps:
      # Build the exact validated release commit rather than mutable main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-source.outputs.commit }}
          persist-credentials: false
      - name: Confirm verified source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-source.outputs.commit }}"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: markata-go-pypi-wheels
          path: dist/pypi-wheels
      - name: Install verified Linux wheel and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/editor-venv"
          wheel="dist/pypi-wheels/markata-${MARKATA_WHEEL_VERSION}-py3-none-manylinux_2_17_x86_64.whl"
          "$RUNNER_TEMP/editor-venv/bin/python" -m pip install --no-index --no-deps "$wheel"
          "$RUNNER_TEMP/editor-venv/bin/python" -m pip install fastapi httpx uvicorn websockets playwright==1.64.1
          "$RUNNER_TEMP/editor-venv/bin/python" -m playwright install --with-deps chromium
      - name: Exercise live editor with installed wheel
        run: '"$RUNNER_TEMP/editor-venv/bin/python" python/test_editor_browser.py -v'
      - name: Verify editor units and Python/Go/WASM parity
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/editor-venv/bin/python" -m unittest discover -s tests/editors -p 'test_*.py' -v
          "$RUNNER_TEMP/editor-venv/bin/python" tests/editors/workspace_ui_checks.py
          go build -o "$RUNNER_TEMP/markata-workbench" ./cmd/markata-workbench
          python scripts/wasm-workbench.py
          "$RUNNER_TEMP/editor-venv/bin/python" tests/editors/test_parity.py \
            --go-binary "$RUNNER_TEMP/markata-workbench" --wasm-output .wasm-workbench
      - name: Verify browser LSP integration
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/markata-example-lsp" ./cmd/markata-go
          MARKATA_LSP_BINARY="$RUNNER_TEMP/markata-example-lsp" \
          MARKATA_WORKBENCH_BINARY="$RUNNER_TEMP/markata-workbench" \
          "$RUNNER_TEMP/editor-venv/bin/python" python/test_browser_lsp.py -v
      - name: Upload browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: editor-parity-browser-evidence
          path: .markata-browser-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  smoke-platforms:
    name: Install Go CLI on ${{ matrix.os }}
    needs: [release-source, wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      MARKATA_WHEEL_VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      # Build the exact validated release commit rather than mutable main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: markata-go-pypi-wheels
          path: dist/pypi-wheels
      - name: Offline install matching platform wheel (no Python legacy fallback)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --no-deps --only-binary=:all: \
            --find-links=dist/pypi-wheels "markata==${MARKATA_WHEEL_VERSION}"
      - name: Exercise Python module and installed Go executable
        shell: bash
        run: |
          set -euo pipefail
          python python/smoke_renderer.py
          python -m markata version
          python -m markata --help
          markata version

  publish:
    name: Publish markata 0.x Go wheels to PyPI
    needs: [release-source, wheels, smoke-platforms, editor-parity]
    # A verified, completed GitHub release authorizes publication. Manual
    # recovery must be dispatched from main; PRs never receive publishing rights.
    if: >-
      always() &&
      needs.release-source.result == 'success' &&
      needs.release-source.outputs.already_published == 'false' &&
      needs.wheels.result == 'success' &&
      needs.smoke-platforms.result == 'success' &&
      (needs.editor-parity.result == 'success' ||
       (needs.release-source.outputs.version == '0.15.0' && needs.editor-parity.result == 'skipped')) &&
      (github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/markata/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: markata-go-pypi-wheels
          path: dist/
      - name: Publish verified wheels using PyPI trusted publisher OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  verify-pypi:
    name: Verify published version on PyPI
    needs: [release-source, wheels, smoke-platforms, editor-parity, publish]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.release-source.result == 'success' &&
      needs.wheels.result == 'success' &&
      needs.smoke-platforms.result == 'success' &&
      (needs.editor-parity.result == 'success' ||
       (needs.release-source.outputs.version == '0.15.0' && needs.editor-parity.result == 'skipped')) &&
      (needs.publish.result == 'success' || needs.release-source.outputs.already_published == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all eight distribution wheels are indexed
        env:
          VERSION: ${{ needs.release-source.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          version = os.environ['VERSION']
          url = f'https://pypi.org/pypi/markata/{version}/json'
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      data = json.load(response)
                  names = [entry['filename'] for entry in data.get('urls', []) if entry['filename'].endswith('.whl')]
                  if len(names) == 8 and all(name.startswith(f'markata-{version}-') for name in names):
                      print(f'PyPI markata {version}: all eight wheels verified')
                      break
                  print(f'Attempt {attempt + 1}: found {len(names)} wheels')
              except Exception as error:
                  print(f'Attempt {attempt + 1}: {error}')
              if attempt == 7:
                  raise SystemExit(f'PyPI markata {version} verification failed')
              time.sleep(8)
          PY
