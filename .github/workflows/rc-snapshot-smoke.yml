name: GoReleaser Snapshot Artifact Smoke

on:
  pull_request:
    paths:
      - '.goreleaser.yml'
      - 'go.mod'
      - 'scripts/check-rc-artifacts.sh'
      - '.github/workflows/rc-snapshot-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Build full snapshot without publishing, signing or generating SBOMs
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign,sbom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify canonical and legacy assets and checksums
        run: bash scripts/check-rc-artifacts.sh
