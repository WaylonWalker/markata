name: GoReleaser Snapshot Artifact Smoke

on:
  pull_request:
    paths:
      - '.goreleaser.yml'
      - 'scripts/nightly-release-version.py'
      - 'go.mod'
      - 'scripts/check-rc-artifacts.sh'
      - '.github/workflows/rc-snapshot-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Exercise date-stamped nightly version override (no publishing)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_nightly_release_version.py' -v
          version="$(python3 scripts/nightly-release-version.py --date 20261022 | sed -n 's/^goreleaser_version=//p')"
          test -n "$version"
          echo "MARKATA_SNAPSHOT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Build full snapshot without publishing, signing or generating SBOMs
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign,sbom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify canonical, legacy and date-stamped assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-rc-artifacts.sh
          test -s "dist/markata_${MARKATA_SNAPSHOT_VERSION}_linux_x86_64.tar.gz"
          test -s "dist/markata-go_${MARKATA_SNAPSHOT_VERSION}_windows_x86_64.zip"
