{% if config.pagination_type == 'js' %}
<div id="feed-items" class="feed-container">
  <!-- Initial page items rendered here -->
</div>

<!-- Infinite scroll trigger -->
{% if has_next %}
<div id="scroll-trigger" style="height: 1px;"></div>

<!-- Loading indicator -->
<div class="loading-indicator" style="display: none;">
  <div class="spinner"></div>
  <span>Loading more...</span>
</div>

<!-- End message -->
{% elif config.show_end_message %}
<div class="end-message">
  <p>You've reached the end of this feed!</p>
</div>
{% endif %}

<!-- Fallback for no-JS -->
<noscript>
  <style>
    .loading-indicator { display: none !important; }
    #scroll-trigger { display: none !important; }
  </style>
  {% include 'pagination/manual.html' %}
</noscript>

<script>
// Feature detection and initialization
if ('IntersectionObserver' in window && {{ config.pagination_type|tojson }} === 'js') {
  class InfiniteScroll {
    constructor() {
      this.currentPage = {{ page }};
      this.totalPages = {{ total_pages }};
      this.feedName = {{ feed_name|tojson }};
      this.loading = false;
      this.threshold = {{ config.auto_load_threshold }};
      this.showEndMessage = {{ config.show_end_message|tojson }};
      
      this.setupObserver();
    }
    
    setupObserver() {
      const trigger = document.getElementById('scroll-trigger');
      if (!trigger) return;
      
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !this.loading) {
          this.loadMore();
        }
      }, { 
        rootMargin: `${this.threshold}px` 
      });
      
      observer.observe(trigger);
    }
    
    async loadMore() {
      if (this.currentPage >= this.totalPages) return;
      
      this.loading = true;
      this.showLoading();
      
      try {
        const nextPage = this.currentPage + 1;
        const response = await fetch(`${this.feedName}/page/${nextPage}/`);
        const html = await response.text();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const newItems = doc.querySelectorAll('.feed-item');
        const container = document.getElementById('feed-items');
        
        newItems.forEach(item => container.appendChild(item));
        
        this.currentPage = nextPage;
        
        // Update URL for bookmarkability
        if (history.pushState) {
          history.pushState({}, '', `${this.feedName}/page/${nextPage}/`);
        }
        
        // Remove trigger if this was the last page
        if (this.currentPage >= this.totalPages) {
          const trigger = document.getElementById('scroll-trigger');
          if (trigger) trigger.remove();
          
          if (this.showEndMessage) {
            this.showEndMessage();
          }
        }
        
      } catch (error) {
        console.error('Failed to load more content:', error);
        this.showError();
      } finally {
        this.loading = false;
        this.hideLoading();
      }
    }
    
    showLoading() {
      const indicator = document.querySelector('.loading-indicator');
      if (indicator) indicator.style.display = 'flex';
    }
    
    hideLoading() {
      const indicator = document.querySelector('.loading-indicator');
      if (indicator) indicator.style.display = 'none';
    }
    
    showEndMessage() {
      const container = document.querySelector('.feed-container').parentNode;
      const endMessage = document.createElement('div');
      endMessage.className = 'end-message';
      endMessage.innerHTML = '<p>You\'ve reached the end of this feed!</p>';
      container.appendChild(endMessage);
    }
    
    showError() {
      const container = document.querySelector('.feed-container').parentNode;
      const errorMsg = document.createElement('div');
      errorMsg.className = 'error-message';
      errorMsg.innerHTML = '<p>Failed to load more content. <a href="">Refresh</a></p>';
      container.appendChild(errorMsg);
    }
  }
  
  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      new InfiniteScroll();
    });
  } else {
    new InfiniteScroll();
  }
}
</script>

<style>
.feed-container {
  min-height: 100vh;
}

.loading-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 2rem;
  color: var(--text-color-muted, #6b7280);
}

.spinner {
  width: 1.5rem;
  height: 1.5rem;
  border: 2px solid var(--border-color, #e5e7eb);
  border-top: 2px solid var(--primary-bg, #3b82f6);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.end-message {
  text-align: center;
  padding: 2rem;
  color: var(--text-color-muted, #6b7280);
  font-style: italic;
  border-top: 1px solid var(--border-color, #e5e7eb);
  margin-top: 2rem;
}

.error-message {
  text-align: center;
  padding: 2rem;
  background: var(--error-bg, #fef2f2);
  border: 1px solid var(--error-border, #fecaca);
  border-radius: 6px;
  color: var(--error-text, #dc2626);
  margin: 2rem 0;
}

.error-message a {
  color: var(--error-text, #dc2626);
  text-decoration: underline;
}

.error-message a:hover {
  text-decoration: none;
}

/* Dark mode support */
@media (prefers-color-scheme: dark) {
  .loading-indicator,
  .end-message {
    color: var(--text-color-muted-dark, #9ca3af);
  }
  
  .spinner {
    border-color: var(--border-color-dark, #374151);
    border-top-color: var(--primary-bg-dark, #2563eb);
  }
  
  .end-message {
    border-color: var(--border-color-dark, #374151);
  }
  
  .error-message {
    background: var(--error-bg-dark, #7f1d1d);
    border-color: var(--error-border-dark, #991b1b);
    color: var(--error-text-dark, #fecaca);
  }
  
  .error-message a {
    color: var(--error-text-dark, #fecaca);
  }
}

/* Accessible focus styles */
.loading-indicator:focus,
.error-message:focus {
  outline: 2px solid var(--primary-bg, #3b82f6);
  outline-offset: 2px;
}
</style>
{% endif %}
