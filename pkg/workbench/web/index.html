<!doctype html>
<html lang="en" data-aesthetic="minimal" data-fontpack="system" data-text-size="large">
<head>
<!--EDITOR_HEAD-->
<!--APPEARANCE_HEAD-->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markata · Markdown workbench</title>
<style>
:root{color-scheme:light;--ink:#203348;--muted:#52697f;--paper:#f4f7fb;--line:#c8d5e2;--accent:#245fc5}
:root{--editor-divider:color-mix(in srgb,var(--color-text,#203348) 12%,var(--color-background,#f4f7fb))}
html{color-scheme:light}html[data-theme="dark"]{color-scheme:dark}
textarea{scrollbar-color:var(--color-text-muted,#738094) var(--color-surface,#eaf0f8);scrollbar-width:thin}
textarea::-webkit-scrollbar{width:10px;height:10px}
textarea::-webkit-scrollbar-track{background:var(--color-surface,#eaf0f8)}
textarea::-webkit-scrollbar-thumb{background:var(--color-text-muted,#738094);border:2px solid var(--color-surface,#eaf0f8);border-radius:8px}
textarea::-webkit-scrollbar-thumb:hover{background:var(--color-primary,#245fc5)}
*{box-sizing:border-box}body{margin:0;background:var(--color-background,var(--paper));color:var(--color-text,var(--ink));font:15px system-ui,sans-serif}
.theme-picker-panel{z-index:1000;text-align:left}.theme-switcher{margin-left:auto}header{min-height:80px;padding:18px 26px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--editor-divider)}
h1{font-family:var(--font-heading,system-ui,sans-serif);font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.025em;margin:0}header p{margin:4px 0 0;color:var(--color-text-muted,var(--muted));font-size:13px}
#download{margin-left:0;background:var(--color-surface,white);border:1px solid var(--line);border-radius:6px;padding:9px 14px;color:var(--color-text,var(--ink));cursor:pointer}
#download:hover{border-color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#workbench{width:100%;max-width:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 117px);min-height:350px}
section{display:flex;flex-direction:column;min-width:0;min-height:0}section+section{border-left:1px solid var(--editor-divider)}
.pane-label{padding:12px 24px;border-bottom:1px solid var(--editor-divider);font-size:12px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}
textarea{resize:none;flex:1;width:100%;border:0;padding:24px;background:var(--color-surface,#eaf0f8);color:var(--color-text,var(--ink));font:14px/1.7 ui-monospace,monospace;tab-size:4}
textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}iframe{flex:1;width:100%;border:0;background:var(--color-background,#131721)}
footer{height:37px;padding:9px 24px;border-top:1px solid var(--editor-divider);font-size:12px;color:var(--color-text-muted,var(--muted))}
#error{margin:0;padding:12px 24px;background:#ffeded;color:#932c2c;white-space:pre-wrap;max-height:160px;overflow:auto}
@media(max-width:700px){header{padding:14px 18px}#workbench{grid-template-columns:1fr;height:auto}section{height:60dvh}section+section{border-left:0;border-top:1px solid var(--editor-divider)}footer{height:auto;min-height:37px}}

.editor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
#keymap{font:12px system-ui;color:var(--color-text);background:var(--color-surface);border:1px solid var(--editor-divider);border-radius:4px;padding:3px 7px}
.CodeMirror{flex:1;min-height:0;height:auto;background:var(--color-background);color:var(--color-text);font:14px/1.7 var(--font-code,ui-monospace,monospace)}
.CodeMirror-gutters{background:var(--color-background);border-right:1px solid var(--editor-divider)}
.CodeMirror-linenumber{color:var(--color-text-muted);opacity:.6}
.CodeMirror-lines{padding:20px 0}.CodeMirror pre.CodeMirror-line{padding:0 16px}
.CodeMirror-cursor{border-left-color:var(--color-text)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:color-mix(in srgb,var(--color-primary) 25%,var(--color-surface))}
.cm-s-default .cm-header,.cm-s-default .cm-link{color:var(--color-primary)}
.cm-s-default .cm-header{font-weight:700}.cm-s-default .cm-quote,.cm-s-default .cm-comment{color:var(--color-text-muted)}
.cm-s-default .cm-keyword,.cm-s-default .cm-tag{color:var(--color-primary)}
.cm-s-default .cm-string,.cm-s-default .cm-string-2{color:var(--color-success,var(--color-primary))}
.cm-s-default .cm-variable-2,.cm-s-default .cm-atom,.cm-s-default .cm-number{color:var(--color-secondary,var(--color-primary))}
.CodeMirror-scroll,.CodeMirror-vscrollbar,.CodeMirror-hscrollbar{scrollbar-width:thin;scrollbar-color:var(--color-text-muted) var(--color-surface)}
.CodeMirror-simplescroll-vertical,.CodeMirror-scrollbar-filler{background:var(--color-background)}
.cm-s-default .cm-def,.cm-s-default .cm-variable,.cm-s-default .cm-property,.cm-s-default .cm-operator{color:var(--color-text)}
.cm-s-default .cm-builtin,.cm-s-default .cm-qualifier,.cm-s-default .cm-attribute{color:var(--color-primary)}
.cm-s-default .cm-variable-3,.cm-s-default .cm-type,.cm-s-default .cm-meta{color:var(--color-text-secondary,var(--color-text))}
.cm-s-default .cm-positive{color:var(--color-success,var(--color-primary))}
.cm-s-default .cm-negative,.cm-s-default .cm-error,.cm-s-default .cm-invalidchar{color:var(--color-error,var(--color-primary))}
.cm-s-default .cm-hr{color:var(--color-text-muted)}
.cm-s-default .cm-url{color:var(--color-link,var(--color-primary))}
.CodeMirror-matchingbracket{color:var(--color-primary)!important;background:color-mix(in srgb,var(--color-primary) 15%,transparent)}
.CodeMirror-nonmatchingbracket{color:var(--color-error,var(--color-primary))!important}
.CodeMirror div.CodeMirror-secondarycursor{border-left-color:var(--color-text-muted)}
.CodeMirror.cm-fat-cursor .CodeMirror-cursor{background:var(--color-text-muted);opacity:.6}
.CodeMirror .cm-searching{background:color-mix(in srgb,var(--color-primary) 35%,transparent)}
.CodeMirror-dialog{background:var(--color-surface);color:var(--color-text);border-color:var(--editor-divider)}
.CodeMirror-dialog input{color:var(--color-text)}


header{flex-wrap:wrap}#open{background:var(--color-surface,white);border:1px solid var(--editor-divider);border-radius:6px;padding:9px 14px;color:var(--color-text);cursor:pointer}#saved{font-weight:600}footer{height:auto;min-height:37px}#offline{font-size:12px;color:var(--color-text-muted)}
</style>
<link rel="stylesheet" href="/editor/command-palette.css">
<script src="/editor/command-catalog.js" defer></script>
<script src="/editor/command-palette.js" defer></script>
<link rel="stylesheet" href="/editor/site-tree.css"><script src="/editor/site-tree.js" defer></script></head><body data-example-url="/editor/command-palette-example.md">
<header><div><h1>Markata Go workbench</h1><p>Write Markdown. Render directly in Go.</p></div><!--PICKER--><button id="open" type="button">Open .md</button><input id="import" type="file" accept=".md,.markdown,text/plain,text/markdown" hidden><button id="download" type="button">Download .md</button></header>
<main id="workbench">
<aside id="site-sidebar" aria-label="Workspace navigation"><div class="pane-label"><label for="site-view">Workspace</label><select id="site-view"><option value="files">Files</option><option value="feeds">Tags</option></select></div><div id="site-files" class="site-tree" aria-label="Site files"></div><div id="site-feeds" class="site-tree" aria-label="Feed members" hidden></div><p>Workspace sources · edits stay in this browser.</p></aside>
<section><div class="pane-label editor-toolbar"><span id="active-file">draft.md</span><label for="keymap">Keymap</label><select id="keymap" aria-label="Editor keymap"><option value="default">Default</option><option value="vim">Vim</option><option value="emacs">Emacs</option><option value="sublime">Sublime</option></select></div><textarea aria-label="Markdown source" id="source" spellcheck="false" aria-describedby="status"></textarea></section>
<section aria-label="Rendered Markdown"><div class="pane-label">Live preview</div><pre id="error" role="alert" hidden></pre><iframe id="preview" title="Rendered Markdown preview" sandbox="allow-scripts"></iframe></section>
</main>
<footer><span id="language-status" role="status" aria-live="polite">Language service connecting…</span> · <span id="saved" role="status"></span> · <span id="status" role="status" aria-live="polite">Preparing preview…</span></footer>
<script src="/editor/app.js" defer></script><!--APPEARANCE_SCRIPTS--></body></html>
