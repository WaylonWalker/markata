server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Do not use SPA fallback: bad documentation links must return 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Filenames are currently not content hashed; never treat them as immutable.
    location ~* \.(?:css|js|png|jpe?g|svg|gif|webp|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
