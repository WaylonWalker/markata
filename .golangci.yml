version: "2"
run:
  go: "1.27"
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
  disable:
    - funlen
    - gochecknoglobals
    - lll
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - whyNoLint
        - hugeParam
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G104
        - G304
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks:
        - all
        - -ST1000
        - -QF*
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - goconst
          - gocyclo
        path: _test\.go
      - linters:
          - gocritic
          - gosec
        path: pkg/fontpacks/.*_test\.go
      - linters:
          - dupl
        path: pkg/config/parser\.go
      - linters:
          - gochecknoinits
        path: main\.go
      - linters:
          - gochecknoinits
        path: cmd/
      - path: _test\.go
        text: dot-imports
      - linters:
          - errcheck
          - goconst
          - gocritic
          - gosec
          - revive
          - tparallel
          - unparam
        path: pkg/builderadmin/
      - linters:
          - gocyclo
          - revive
        path: pkg/plugins/build_cache\.go
      - linters:
          - unused
        path: pkg/plugins/feed_rendering\.go
      - linters:
          - unused
        path: pkg/plugins/publish_feeds\.go
      - linters:
          - gocritic
        path: pkg/plugins/glob\.go
      - linters:
          - revive
        path: cmd/markata-go/cmd/builder_admin\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/WaylonWalker/markata
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
