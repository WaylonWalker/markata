[markata-go]
title = "Markata"
description = "Documentation for Markata, the Markdown static site generator."
url = "https://markata.dev"
output_dir = "docs-site/_site"
templates_dir = "templates"
assets_dir = "static"
lang = "en"

[markata-go.glob]
patterns = ["docs/**/*.md"]
slug_mode = "path"

[markata-go.auto_feeds.tags]
enabled = false

[markata-go.theme]
palette = "ayu-dark"
aesthetic = "minimal"

[markata-go.layout]
name = "docs"

[markata-go.layout.docs]
sidebar_position = "left"
header_style = "minimal"
footer_style = "minimal"

[markata-go.sidebar]
enabled = true
title = "Documentation"
auto_generate = { directory = "docs", order_by = "filename" }

[[markata-go.head.link]]
rel = "icon"
href = "/favicon.ico"
