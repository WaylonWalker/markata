  ibm-plex-sans:            { provider: google-fonts, family: "IBM Plex Sans" }
  ibm-plex-sans-condensed:  { provider: google-fonts, family: "IBM Plex Sans Condensed" }
  ibm-plex-serif:           { provider: google-fonts, family: "IBM Plex Serif" }
  ibm-plex-mono:            { provider: google-fonts, family: "IBM Plex Mono" }
  water-brush:              { provider: google-fonts, family: "Water Brush" }
  knewave:                  { provider: google-fonts, family: "Knewave" }
  space-grotesk:            { provider: google-fonts, family: "Space Grotesk" }
  covered-by-your-grace:    { provider: google-fonts, family: "Covered By Your Grace" }
  dm-mono:                  { provider: google-fonts, family: "DM Mono" }
