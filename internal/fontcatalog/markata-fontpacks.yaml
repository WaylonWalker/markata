      heading:    { stack: sans, weight: 700 }
      subheading: { stack: sans, weight: 650 }
      body:       { stack: sans, weight: 400 }
      lead:       { stack: sans, weight: 500, size: 1.16rem }
      quote:      { stack: serif, style: italic, size: 1.2rem }
      caption:    { stack: sans, weight: 400 }
      code:       { stack: mono, weight: 400 }
      ui:         { stack: sans, weight: 500 }
      metadata:   { stack: sans, weight: 500 }
      label:      { stack: sans, weight: 650 }
      numbers:    { stack: mono, weight: 450 }

