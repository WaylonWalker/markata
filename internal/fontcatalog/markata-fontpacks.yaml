# markata-fontpacks.yaml
#
# Markata editorial font packs and font acquisition catalog.
#
# Built-in font packs fall into two performance classes:
#   zero-download  Uses only system fonts and emits no @font-face assets.
#   bundled        Uses curated, vendored, stable WOFF2 tiers shipped with Markata.
#
# Custom fonts are resolved through the same source schema, but require the
# optional font-ingestion toolchain when their prebuilt tiers do not exist.

schema: markata.fontpacks/v2
version: 2

catalog:
  content_version: 2026.08.0
  lockfile: markata-fonts.lock.yaml
  bundled_asset_root: .
  project_asset_root: assets/fonts
  output_asset_root: assets/fonts
  resolution_order: [project, user, builtin]

system_stacks:
  sans:
    css: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  serif:
    css: 'ui-serif, Georgia, Cambria, "Times New Roman", Times, serif'
  book:
    css: 'Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, ui-serif, serif'
  mono:
    css: 'ui-monospace, "SFMono-Regular", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace'
  condensed:
    css: '"Arial Narrow", "Roboto Condensed", "Helvetica Neue Condensed", system-ui, sans-serif'

defaults:
  typography:
    body:
      size: 1rem
      line_height: 1.68
      measure: 68ch
    heading:
      line_height: 1.08
      text_wrap: balance
    code:
      line_height: 1.55
      ligatures: false
    caption:
      size: 0.84rem
      line_height: 1.45
    metadata:
      size: 0.78rem
      letter_spacing: 0.075em
    label:
      size: 0.74rem
      letter_spacing: 0.09em
      text_transform: uppercase
    numbers:
      font_variant_numeric: tabular-nums

subset_profiles:
  display-core:
    description: Compact Latin set for hero, poster, and decorative display text.
    unicode:
      - U+0020-007E
      - U+00A0
      - U+00A2-00A5
      - U+00A9
      - U+00AE
      - U+00B0
      - U+00D7
      - U+00F7
      - U+2010-2027
      - U+2030
      - U+2032-2033
      - U+2044
      - U+20AC
      - U+2122
      - U+2190-2199

  prose-core:
    description: Broad reusable Latin set for English prose and common names.
    unicode:
      - U+0020-007E
      - U+00A0-00FF
      - U+0100-017F
      - U+0180-024F
      - U+1E00-1EFF
      - U+2000-206F
      - U+20A0-20CF
      - U+2100-214F
      - U+2190-21FF
      - U+2150-218F

  prose-basic:
    description: Common Latin prose, punctuation, and arrows for the first font transfer.
    unicode:
      - U+0020-007E
      - U+00A0-00FF
      - U+2000-206F
      - U+20AC
      - U+2122
      - U+2150-21FF

  prose-extra:
    description: Disjoint remainder of prose-core, loaded for extended text.
    unicode:
      - U+0100-024F
      - U+1E00-1EFF
      - U+20A0-20AB
      - U+20AD-20CF
      - U+2100-2121
      - U+2123-214F

  code-core:
    description: ASCII, programming punctuation, arrows, math, box drawing, and block characters.
    unicode:
      - U+0020-007E
      - U+00A0
      - U+00AC
      - U+00B0
      - U+00B1
      - U+00B7
      - U+00D7
      - U+00F7
      - U+2010-2027
      - U+2190-21FF
      - U+2200-22FF
      - U+2300-23FF
      - U+2500-259F
      - U+25A0-25FF

  latin-ext:
    description: Additional Latin coverage loaded only when a page needs it.
    unicode:
      - U+0180-024F
      - U+1E00-1EFF
      - U+2C60-2C7F
      - U+A720-A7FF
      - U+AB30-AB6F

  full:
    description: Complete upstream face. Used only for unsupported scripts or explicit full coverage.
    passthrough: true

# Acquisition metadata. A resolver turns each Google Fonts family into an exact
# repository path, source file, license, and commit in markata-fonts.lock.yaml.
#
# The config intentionally does not hard-code a moving branch URL or an unpinned
# source filename. `markata fonts vendor --lock` resolves these against the
# official google/fonts repository and records immutable values in the lockfile.
font_sources:
  inter:                    { provider: google-fonts, family: "Inter" }
  inter-tight:              { provider: google-fonts, family: "Inter Tight" }
  source-serif-4:           { provider: google-fonts, family: "Source Serif 4" }
  source-sans-3:            { provider: google-fonts, family: "Source Sans 3" }
