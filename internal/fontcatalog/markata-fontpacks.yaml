  crimson-pro:              { provider: google-fonts, family: "Crimson Pro" }
  im-fell-english:          { provider: google-fonts, family: "IM FELL English" }
  libre-franklin:           { provider: google-fonts, family: "Libre Franklin" }
  courier-prime:            { provider: google-fonts, family: "Courier Prime" }
  syne:                     { provider: google-fonts, family: "Syne" }
  manrope:                  { provider: google-fonts, family: "Manrope" }
