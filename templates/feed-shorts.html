<!doctype html>
<html lang="{{ config.lang | default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ feed.title | default:"Shorts" }} — Shorts</title>
  <meta name="description" content="{{ feed.description | default:"Full-screen photos and videos" }}">
  {% if feed_robots %}<meta name="robots" content="{{ feed_robots }}">{% endif %}
  {# Tiny critical layout keeps the initial preview visible while the CSS file loads. #}
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#fff;font-family:system-ui,sans-serif}
    .shorts-viewer{position:fixed;inset:0;overflow:hidden;background:#090909}
    .shorts-slides{position:absolute;inset:0;pointer-events:none}
    .shorts-first-frame{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#111}
    .shorts-first-frame img{display:block;width:100%;height:100%;object-fit:contain;filter:blur(10px)}
    .shorts-top,.shorts-hud{position:absolute;z-index:3}
    .shorts-top{top:0;left:0;right:0}
    .shorts-hud{bottom:0;left:0;right:0}
  </style>
  <link rel="stylesheet" href="{{ 'css/feed-shorts.css' | theme_asset_hashed }}">
  <script defer src="{{ 'js/feed-shorts.js' | theme_asset_hashed }}"></script>
</head>
<body class="shorts-body">
<section class="shorts-viewer" id="shorts-viewer" data-manifest="{{ shorts_manifest_url }}" aria-label="Shorts media viewer">
  <div id="shorts-slides" class="shorts-slides" aria-hidden="true">
    {% if shorts_first_frame_src %}
    <div class="shorts-first-frame" id="shorts-first-frame" data-id="{{ shorts_first_frame_id }}">
      <img class="shorts-first-frame-image" src="{{ shorts_first_frame_src }}" alt="" aria-hidden="true" loading="eager" decoding="async" fetchpriority="high">
    </div>
    {% endif %}
  </div>
  <header class="shorts-top">
    <a href="{{ feed.base_url }}/" class="shorts-grid-link" aria-label="Return to photo grid">← Shots</a>
    <span class="shorts-counter" id="shorts-counter" aria-live="polite">Shorts</span>
  </header>
  <div class="shorts-hud" id="shorts-hud">
    <div class="shorts-hud-copy">
      <h1 class="shorts-title" id="shorts-title">Shorts</h1>
      <p class="shorts-description" id="shorts-description"></p>
      <button type="button" class="shorts-more" id="shorts-more" hidden aria-expanded="false">More</button>
      <a id="shorts-permalink" class="shorts-permalink" href="{{ feed.base_url }}/">View post ↗</a>
    </div>
    <div class="shorts-actions" aria-label="Playback and navigation">
      <button type="button" class="shorts-action" id="shorts-up" aria-label="Previous short" title="Previous (↑)">↑</button>
      <button type="button" class="shorts-action" id="shorts-down" aria-label="Next short" title="Next (↓)">↓</button>
      <button type="button" class="shorts-action" id="shorts-play" aria-label="Pause video" title="Pause or play" hidden>Ⅱ</button>
      <button type="button" class="shorts-action" id="shorts-sound" aria-label="Unmute video" title="Mute or unmute" hidden>♪</button>
    </div>
  </div>
  <div class="shorts-end" id="shorts-end" hidden>
    <span>You've seen every shot.</span>
    <button type="button" id="shorts-restart">Back to first</button>
  </div>
  <div class="shorts-message" id="shorts-message" role="status" aria-live="polite">Loading shorts…</div>
  <noscript><div class="shorts-noscript">JavaScript is required for this full-screen view. <a href="{{ feed.base_url }}/">Browse the photo grid</a>.</div></noscript>
</section>
</body>
</html>
