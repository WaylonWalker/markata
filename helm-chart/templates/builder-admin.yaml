{{- if .Values.builderAdmin.enabled }}
{{- if not .Values.builderAdmin.ingress.enabled }}{{ fail "builderAdmin.ingress.enabled must be true when builder-admin is enabled" }}{{ end }}
{{- if not .Values.builderAdmin.ingress.auth.enabled }}{{ fail "builderAdmin.ingress.auth.enabled must be true when builder-admin is enabled" }}{{ end }}
{{- if not .Values.builderAdmin.ingress.tls.enabled }}{{ fail "builderAdmin.ingress.tls.enabled must be true when builder-admin is enabled" }}{{ end }}
{{- if not .Values.builderAdmin.networkPolicy.enabled }}{{ fail "builderAdmin.networkPolicy.enabled must be true when builder-admin is enabled" }}{{ end }}
{{- $_ := required "builderAdmin.ingress.host is required when builder-admin is enabled" .Values.builderAdmin.ingress.host }}
{{- $_ := required "builderAdmin.ingress.tls.secretName is required when builder-admin is enabled" .Values.builderAdmin.ingress.tls.secretName }}
{{- include "markata-notes.validateBuilderAdminAuthInternalURL" . }}
{{- $_ := required "builderAdmin.auth.trustedProxyCIDRs must be non-empty when builder-admin is enabled" (first .Values.builderAdmin.auth.trustedProxyCIDRs) }}
{{- $_ := required "builderAdmin.auth.headers.userID is required when builder-admin is enabled" .Values.builderAdmin.auth.headers.userID }}
{{- if .Values.builderAdmin.webhook.enabled }}{{- $_ := required "builderAdmin.webhook.existingSecretName is required when builderAdmin.webhook.enabled" .Values.builderAdmin.webhook.existingSecretName }}{{- $_ := required "builderAdmin.webhook.existingSecretKey is required when builderAdmin.webhook.enabled" .Values.builderAdmin.webhook.existingSecretKey }}{{- end }}
{{- if .Values.builderAdmin.sourceGit.enabled }}{{- $_ := required "builderAdmin.sourceGit.repository is required when builderAdmin.sourceGit.enabled" .Values.builderAdmin.sourceGit.repository }}{{- $_ := required "builderAdmin.sourceGit.branch is required when builderAdmin.sourceGit.enabled" .Values.builderAdmin.sourceGit.branch }}{{- if lt (int .Values.builderAdmin.sourceGit.depth) 1 }}{{ fail "builderAdmin.sourceGit.depth must be at least 1" }}{{ end }}{{- end }}
{{- if .Values.builderAdmin.editor.enabled }}
{{- $_ := required "builderAdmin.editor.ingress.host is required when the hosted editor is enabled" .Values.builderAdmin.editor.ingress.host }}
{{- $_ := required "builderAdmin.editor.ingress.ingressClassName is required when the hosted editor is enabled" .Values.builderAdmin.editor.ingress.ingressClassName }}
{{- $_ := required "builderAdmin.editor.ingress.tls.secretName is required when the hosted editor is enabled" .Values.builderAdmin.editor.ingress.tls.secretName }}
{{- $_ := required "builderAdmin.editor.requiredScope is required when the hosted editor is enabled" .Values.builderAdmin.editor.requiredScope }}
{{- if not (or (hasSuffix ":admin" .Values.builderAdmin.editor.requiredScope) (hasSuffix ":write" .Values.builderAdmin.editor.requiredScope)) }}{{ fail "builderAdmin.editor.requiredScope must be an app-specific writer scope ending in :admin or :write" }}{{ end }}
{{- if ne (int .Values.builderAdmin.editor.port) 8766 }}{{ fail "builderAdmin.editor.port must match the editor's supported port 8766" }}{{ end }}
{{- range .Values.builderAdmin.editor.extraEnv }}
{{- if eq .name "DROPPER_TOKEN" }}{{ fail "DROPPER_TOKEN must be configured only on the hosted editor Dropper uploader sidecar" }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.builderAdmin.workspace.enabled }}
{{- $_ := required "builderAdmin.workspace.mountPath is required when workspace is enabled" .Values.builderAdmin.workspace.mountPath }}
{{- $_ := required "builderAdmin.workspace.workDir is required when workspace is enabled" .Values.builderAdmin.workspace.workDir }}
{{- if and (ne .Values.builderAdmin.workspace.mode "emptyDir") (ne .Values.builderAdmin.workspace.mode "hostPath") }}{{ fail "builderAdmin.workspace.mode must be emptyDir or hostPath" }}{{ end }}
{{- if eq .Values.builderAdmin.workspace.mode "hostPath" }}{{- $_ := required "builderAdmin.workspace.hostPath.path is required for hostPath workspace mode" .Values.builderAdmin.workspace.hostPath.path }}{{- end }}
{{- end }}
{{- range .Values.builderAdmin.auth.trustedProxyCIDRs }}
{{- $trustedCIDR := trim . }}
{{- if or (eq $trustedCIDR "0.0.0.0/0") (eq $trustedCIDR "::/0") }}{{ fail "builderAdmin.auth.trustedProxyCIDRs must not include a universal CIDR" }}{{ end }}
{{- end }}
{{- $_ := required "builderAdmin.networkPolicy.traefikNamespace is required when builder-admin is enabled" .Values.builderAdmin.networkPolicy.traefikNamespace }}
{{- $_ := required "builderAdmin.networkPolicy.traefikNamespaceSelector must be non-empty when builder-admin is enabled" (first (keys .Values.builderAdmin.networkPolicy.traefikNamespaceSelector)) }}
{{- $_ := required "builderAdmin.networkPolicy.traefikPodSelector must be non-empty when builder-admin is enabled" (first (keys .Values.builderAdmin.networkPolicy.traefikPodSelector)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.project_identifier }}-notes-builder-admin"
  namespace: "{{ include "markata-notes.namespace" . }}"
  labels:
    service: "{{ .Values.project_identifier }}-notes-builder-admin"
    {{- include "markata-notes.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.builderAdmin.strategy.type | quote }}
    {{- if eq .Values.builderAdmin.strategy.type "RollingUpdate" }}
    {{- with .Values.builderAdmin.strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  selector:
    matchLabels:
      service: "{{ .Values.project_identifier }}-notes-builder-admin"
  template:
    metadata:
      labels:
        service: "{{ .Values.project_identifier }}-notes-builder-admin"
        {{- include "markata-notes.labels" . | nindent 8 }}
    spec:
      serviceAccountName: "{{ include "markata-notes.serviceAccountName" . }}"
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if or .Values.builderAdmin.sourceGit.enabled (and (ne (.Values.storage.source.mode | default "pvc") "hostPath") .Values.search.waitForSource.enabled) .Values.builderAdmin.editor.enabled }}
      initContainers:
        {{- if .Values.builderAdmin.sourceGit.enabled }}
        - name: initialize-source-git
          image: {{ .Values.builderAdmin.sourceGit.image | quote }}
          imagePullPolicy: {{ .Values.builderAdmin.sourceGit.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              source_volume=/data/source-volume
              checkout="$source_volume/checkout"
              for incomplete in "$source_volume"/.checkout-bootstrap.*; do
                [ -e "$incomplete" ] || continue
                rm -rf "$incomplete"
              done
              if git -C "$checkout" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                git -C "$checkout" fetch --depth="$SOURCE_GIT_DEPTH" origin "$SOURCE_GIT_BRANCH"
                git -C "$checkout" checkout -B "$SOURCE_GIT_BRANCH" "origin/$SOURCE_GIT_BRANCH"
                git -C "$checkout" reset --hard "origin/$SOURCE_GIT_BRANCH"
              else
                if [ -e "$checkout" ]; then
                  echo "source checkout path exists but is not a Git repository" >&2
                  exit 1
                fi
                bootstrap=$(mktemp -d "$source_volume/.checkout-bootstrap.XXXXXX")
                git clone --depth "$SOURCE_GIT_DEPTH" --branch "$SOURCE_GIT_BRANCH" \
                  "$SOURCE_GIT_REPOSITORY" "$bootstrap/checkout"
                mv "$bootstrap/checkout" "$checkout"
                rmdir "$bootstrap"
              fi
              touch "$source_volume/.markata-notes-source-ready"
          env:
            - name: SOURCE_GIT_REPOSITORY
              value: {{ .Values.builderAdmin.sourceGit.repository | quote }}
            - name: SOURCE_GIT_BRANCH
              value: {{ .Values.builderAdmin.sourceGit.branch | quote }}
            - name: SOURCE_GIT_DEPTH
              value: {{ .Values.builderAdmin.sourceGit.depth | quote }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source
              mountPath: /data/source-volume
        {{- end }}
        {{- if and (not .Values.builderAdmin.sourceGit.enabled) (ne (.Values.storage.source.mode | default "pvc") "hostPath") .Values.search.waitForSource.enabled }}
        - name: wait-for-source
          image: "{{ .Values.build.builderImage.name }}:{{ .Values.build.builderImage.tag }}"
          imagePullPolicy: {{ .Values.build.builderImage.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              deadline=$(($(date +%s) + {{ .Values.search.waitForSource.timeoutSeconds }}))
              until [ -f /data/source/.markata-notes-source-ready ] && \
                [ ! -L /data/source/.markata-notes-source-ready ]; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "timed out waiting for source content in /data/source" >&2
                  ls -la /data/source >&2
                  exit 1
                fi
                sleep {{ .Values.search.waitForSource.pollIntervalSeconds }}
              done
          resources:
            {{- toYaml .Values.search.waitForSource.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: /data/source
        {{- end }}
        {{- if .Values.builderAdmin.editor.enabled }}
        - name: prepare-editor-git-key
          image: "{{ .Values.build.builderImage.name }}:{{ .Values.build.builderImage.tag }}"
          imagePullPolicy: {{ .Values.build.builderImage.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
          args:
            - install -m 0400 /run/markata-git-secret/id_ed25519 /run/markata-git/id_ed25519 && chown 65534:1000 /run/markata-git/id_ed25519{{- if .Values.builderAdmin.editor.dropperUploader.enabled }} && chmod 0770 /run/markata-dropper && chown 65534:1000 /run/markata-dropper{{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: editor-git-publish
              mountPath: /run/markata-git-secret
              readOnly: true
            - name: editor-git-publish-key
              mountPath: /run/markata-git
            {{- if .Values.builderAdmin.editor.dropperUploader.enabled }}
            - name: editor-dropper-uploader-socket
              mountPath: /run/markata-dropper
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: "{{ .Values.project_identifier }}-notes-builder-admin"
          image: "{{ .Values.build.builderImage.name }}:{{ .Values.build.builderImage.tag }}"
          imagePullPolicy: {{ .Values.build.builderImage.pullPolicy }}
          command:
            - markata-go
            - builder-admin
          args:
            - --host
            - {{ .Values.builderAdmin.host | quote }}
            - --port
            - {{ .Values.builderAdmin.port | quote }}
            - --source-dir
            - /data/source
            - --release-dir
            - /data/site
            {{- if .Values.builderAdmin.workspace.enabled }}
            - --work-dir
            - {{ .Values.builderAdmin.workspace.workDir | quote }}
            {{- end }}
            - --history-dir
            - {{ .Values.builderAdmin.historyDir | quote }}
            - --watch={{ ternary "true" "false" .Values.builderAdmin.watch.enabled }}
            - --watch-debounce
            - {{ .Values.builderAdmin.watch.debounce | quote }}
            {{- if .Values.builderAdmin.webhook.enabled }}
            - --webhook-enabled
            - --webhook-branch
            - {{ .Values.builderAdmin.webhook.branch | quote }}
            {{- end }}
            - --releases-keep
            - {{ .Values.builderAdmin.releases.keep | quote }}
            - --successful-builds-keep
            - {{ .Values.builderAdmin.history.successfulBuilds | quote }}
            - --failed-builds-keep
            - {{ .Values.builderAdmin.history.failedBuilds | quote }}
            - --refresh-runs-keep
            - {{ .Values.builderAdmin.history.refreshRuns | quote }}
            - --build-timeout
            - {{ printf "%ds" (int .Values.builderAdmin.buildTimeoutSeconds) | quote }}
            - --public-origin
            - {{ printf "https://%s" .Values.builderAdmin.ingress.host | quote }}
            - --preview-origin
            - {{ printf "https://%s" (include "markata-notes.host" .) | quote }}
            {{- range .Values.builderAdmin.auth.trustedProxyCIDRs }}
            - --trusted-proxy-cidr
            - {{ . | quote }}
            {{- end }}
            - --auth-user-id-header
            - {{ .Values.builderAdmin.auth.headers.userID | quote }}
            - --auth-username-header
            - {{ .Values.builderAdmin.auth.headers.username | quote }}
            - --auth-display-name-header
            - {{ .Values.builderAdmin.auth.headers.displayName | quote }}
            - --auth-email-header
            - {{ .Values.builderAdmin.auth.headers.email | quote }}
            - --auth-groups-header
            - {{ .Values.builderAdmin.auth.headers.groups | quote }}
            - --auth-roles-header
            - {{ .Values.builderAdmin.auth.headers.roles | quote }}
            - --auth-scopes-header
            - {{ .Values.builderAdmin.auth.headers.scopes | quote }}
            - --auth-method-header
            - {{ .Values.builderAdmin.auth.headers.authMethod | quote }}
            {{- if .Values.builderAdmin.ingress.auth.publicAuthOrigin }}
            - --public-auth-origin
            - {{ .Values.builderAdmin.ingress.auth.publicAuthOrigin | quote }}
            {{- end }}
            {{- if .Values.builderAdmin.fast }}
            - --fast
            {{- end }}
            {{- if not .Values.builderAdmin.pageWeight }}
            - --page-weight=false
            {{- end }}
            {{- if .Values.builderAdmin.dag }}
            - --dag
            {{- end }}
            {{- if .Values.builderAdmin.mermaidMode }}
            - --mermaid-mode
            - {{ .Values.builderAdmin.mermaidMode | quote }}
            {{- end }}
            {{- if .Values.storage.cache.enabled }}
            - --cache-mount
            - {{ .Values.storage.cache.mountPath | quote }}
            {{- end }}
            {{- if .Values.search.configPath }}
            - --config
            - {{ .Values.search.configPath | quote }}
            {{- end }}
            {{- range .Values.builderAdmin.refreshTasks }}
            - --refresh-task
            - {{ printf "%s|%s|%t|%s" .name .every .enqueueBuildOnSuccess (join "|" .args) | quote }}
            {{- end }}
          {{- if .Values.markataEncryption.secretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.markataEncryption.secretName | quote }}
          {{- end }}
          env:
            # Environment injection is backward-compatible with older builder images:
            # they ignore this setting until the new executable is rolled out.
            - name: MARKATA_GO_BUILDER_ADMIN_STARTUP_REBUILD
              value: {{ ternary "true" "false" .Values.builderAdmin.buildOnStartupRevisionChange | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HTTP_PROXY
              value: {{ .Values.build.proxy.http | quote }}
            - name: HTTPS_PROXY
              value: {{ .Values.build.proxy.https | quote }}
            - name: MARKATA_GO_OFFLINE
              value: {{ ternary "true" "false" .Values.offline.enabled | quote }}
            - name: MARKATA_GO_BUNDLED_ASSETS_CACHE_DIR
              value: {{ .Values.offline.bundledAssetsCacheDir | quote }}
            - name: MARKATA_GO_BUNDLED_MERMAID_DIR
              value: {{ .Values.offline.bundledMermaidDir | quote }}
            - name: XDG_CACHE_HOME
              value: {{ .Values.build.cacheDir | quote }}
            {{- if .Values.builderAdmin.webhook.enabled }}
            - name: MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.builderAdmin.webhook.existingSecretName | quote }}
                  key: {{ .Values.builderAdmin.webhook.existingSecretKey | quote }}
            {{- end }}
            {{- with .Values.build.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.builderAdmin.port }}
              name: http
          resources:
            {{- toYaml .Values.builderAdmin.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: /data/source
              {{- if .Values.builderAdmin.sourceGit.enabled }}
              subPath: checkout
              {{- end }}
            - name: site
              mountPath: /data/site
            {{- if .Values.builderAdmin.workspace.enabled }}
            - name: workspace
              mountPath: {{ .Values.builderAdmin.workspace.mountPath | quote }}
            {{- end }}
            {{- if .Values.storage.cache.enabled }}
            - name: cache
              mountPath: {{ .Values.storage.cache.mountPath | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 1
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 12
        {{- if .Values.builderAdmin.editor.enabled }}
        - name: "{{ .Values.project_identifier }}-notes-editor-git-publisher"
          image: "{{ .Values.build.builderImage.name }}:{{ .Values.build.builderImage.tag }}"
          imagePullPolicy: {{ .Values.build.builderImage.pullPolicy }}
          command:
            - markata-go
            - editor-git-publisher
          args:
            - --source-dir
            - /data/source
            - --socket
            - /run/markata-publisher/publisher.sock
            - --origin-url
            - {{ (.Values.builderAdmin.editor.gitAuth.repository | default .Values.builderAdmin.sourceGit.repository) | quote }}
            - --branch
            - {{ printf "refs/heads/%s" (.Values.builderAdmin.editor.gitAuth.branch | default .Values.builderAdmin.sourceGit.branch) | quote }}
            - --private-key
            - /run/markata-git/id_ed25519
            - --known-hosts
            - /etc/ssh/known_hosts
          env:
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml .Values.builderAdmin.editor.publisherResources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source
              mountPath: /data/source
              {{- if .Values.builderAdmin.sourceGit.enabled }}
              subPath: checkout
              {{- end }}
            - name: editor-git-publish-key
              mountPath: /run/markata-git
              readOnly: true
            - name: editor-ssh-known-hosts
              mountPath: /etc/ssh/known_hosts
              subPath: known_hosts
              readOnly: true
            - name: editor-git-publisher-socket
              mountPath: /run/markata-publisher
            - name: editor-git-publisher-tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -S /run/markata-publisher/publisher.sock"]
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -S /run/markata-publisher/publisher.sock"]
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 3
        {{- if .Values.builderAdmin.editor.dropperUploader.enabled }}
        - name: "{{ .Values.project_identifier }}-notes-editor-dropper-uploader"
          image: "{{ .Values.build.builderImage.name }}:{{ .Values.build.builderImage.tag }}"
          imagePullPolicy: {{ .Values.build.builderImage.pullPolicy }}
          command:
            - markata-go
            - editor-dropper-uploader
          args:
            - --socket
            - /run/markata-dropper/uploader.sock
            - --endpoint
            - {{ .Values.builderAdmin.editor.dropperUploader.endpoint | quote }}
          env:
            - name: DROPPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.builderAdmin.editor.dropperUploader.existingSecretName | quote }}
                  key: {{ .Values.builderAdmin.editor.dropperUploader.tokenKey | quote }}
          resources:
            {{- toYaml .Values.builderAdmin.editor.dropperUploader.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: editor-dropper-uploader-socket
              mountPath: /run/markata-dropper
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -S /run/markata-dropper/uploader.sock"]
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -S /run/markata-dropper/uploader.sock"]
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 3
        {{- end }}
        - name: "{{ .Values.project_identifier }}-notes-editor"
          image: "{{ .Values.build.builderImage.name }}:{{ .Values.build.builderImage.tag }}"
          imagePullPolicy: {{ .Values.build.builderImage.pullPolicy }}
          command:
            - markata-go
            - editor
          args:
            - --workspace
            - /data/source
            - --listen
            - "0.0.0.0:{{ .Values.builderAdmin.editor.port }}"
            - --public-origin
            - {{ printf "https://%s" .Values.builderAdmin.editor.ingress.host | quote }}
            - --required-scope
            - {{ .Values.builderAdmin.editor.requiredScope | quote }}
            - --git-publisher-socket
            - /run/markata-publisher/publisher.sock
            {{- if .Values.builderAdmin.editor.dropperUploader.enabled }}
            - --dropper-uploader-socket
            - /run/markata-dropper/uploader.sock
            {{- end }}
            {{- range .Values.builderAdmin.auth.trustedProxyCIDRs }}
            - --trusted-proxy-cidr
            - {{ . | quote }}
            {{- end }}
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /data/source
            {{- with .Values.builderAdmin.editor.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.builderAdmin.editor.port }}
              name: editor-http
              protocol: TCP
          resources:
            {{- toYaml .Values.builderAdmin.editor.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: /data/source
              {{- if .Values.builderAdmin.sourceGit.enabled }}
              subPath: checkout
              {{- end }}
            - name: editor-git-publisher-socket
              mountPath: /run/markata-publisher
            {{- if .Values.builderAdmin.editor.dropperUploader.enabled }}
            - name: editor-dropper-uploader-socket
              mountPath: /run/markata-dropper
            {{- end }}
          startupProbe:
            tcpSocket:
              port: editor-http
            timeoutSeconds: 1
            # Workspace discovery and watcher registration happen before the listener opens.
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: editor-http
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 12
        {{- end }}
      volumes:
        - name: source
          {{- if eq (.Values.storage.source.mode | default "pvc") "hostPath" }}
          hostPath:
            path: {{ .Values.storage.source.hostPath.path | quote }}
            type: {{ .Values.storage.source.hostPath.type | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: "{{ include "markata-notes.sourcePvcName" . }}"
          {{- end }}
        {{- if .Values.builderAdmin.editor.enabled }}
        - name: editor-git-publisher-socket
          emptyDir: {}
        {{- if .Values.builderAdmin.editor.dropperUploader.enabled }}
        - name: editor-dropper-uploader-socket
          emptyDir: {}
        {{- end }}
        - name: editor-git-publisher-tmp
          emptyDir: {}
        - name: editor-git-publish-key
          emptyDir: {}
        - name: editor-git-publish
          secret:
            secretName: {{ .Values.builderAdmin.editor.gitAuth.existingSecretName | quote }}
            # OpenSSH requires owner-only key permissions. The init container
            # copies this root-owned source into a publisher-only 0400 volume.
            defaultMode: 0400
            items:
              - key: {{ .Values.builderAdmin.editor.gitAuth.privateKeyKey | quote }}
                path: id_ed25519
        - name: editor-ssh-known-hosts
          configMap:
            name: "{{ .Values.project_identifier }}-notes-editor-ssh"
            items:
              - key: known_hosts
                path: known_hosts
        {{- end }}
        - name: site
          {{- if eq (.Values.storage.site.mode | default "pvc") "hostPath" }}
          hostPath:
            path: {{ .Values.storage.site.hostPath.path | quote }}
            type: {{ .Values.storage.site.hostPath.type | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: "{{ include "markata-notes.sitePvcName" . }}"
          {{- end }}
        {{- if .Values.builderAdmin.workspace.enabled }}
        - name: workspace
          {{- if eq .Values.builderAdmin.workspace.mode "hostPath" }}
          hostPath:
            path: {{ .Values.builderAdmin.workspace.hostPath.path | quote }}
            type: {{ .Values.builderAdmin.workspace.hostPath.type | quote }}
          {{- else }}
          emptyDir:
            {{- toYaml .Values.builderAdmin.workspace.emptyDir | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.storage.cache.enabled }}
        - name: cache
          {{- if eq (.Values.storage.cache.mode | default "pvc") "hostPath" }}
          hostPath:
            path: {{ .Values.storage.cache.hostPath.path | quote }}
            type: {{ .Values.storage.cache.hostPath.type | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: "{{ include "markata-notes.cachePvcName" . }}"
          {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.project_identifier }}-notes-builder-admin"
  namespace: "{{ include "markata-notes.namespace" . }}"
  labels:
    service: "{{ .Values.project_identifier }}-notes-builder-admin"
    {{- include "markata-notes.labels" . | nindent 4 }}
spec:
  selector:
    service: "{{ .Values.project_identifier }}-notes-builder-admin"
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.builderAdmin.port }}
      targetPort: http
{{- end }}
