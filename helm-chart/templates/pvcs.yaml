{{- if eq (.Values.storage.source.mode | default "pvc") "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "markata-notes.sourcePvcName" . }}"
  namespace: "{{ include "markata-notes.namespace" . }}"
  labels:
    {{- include "markata-notes.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.source.accessModes | nindent 4 }}
  {{- with .Values.storage.source.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.source.size | quote }}
{{- if and (eq (.Values.storage.source.mode | default "pvc") "pvc") (eq (.Values.storage.site.mode | default "pvc") "pvc") }}
---
{{- end }}
{{- if and (eq (.Values.storage.site.mode | default "pvc") "pvc") (not .Values.storage.site.existingClaimName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "markata-notes.sitePvcName" . }}"
  namespace: "{{ include "markata-notes.namespace" . }}"
  labels:
    {{- include "markata-notes.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.site.accessModes | nindent 4 }}
  {{- with .Values.storage.site.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.site.volumeName }}
  volumeName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.site.size | quote }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "markata-notes.searchPvcName" . }}"
  namespace: "{{ include "markata-notes.namespace" . }}"
  labels:
    {{- include "markata-notes.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.search.accessModes | nindent 4 }}
  {{- with .Values.storage.search.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.search.size | quote }}
{{- end }}
{{- if .Values.storage.cache.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "markata-notes.cachePvcName" . }}"
  namespace: "{{ include "markata-notes.namespace" . }}"
  labels:
    {{- include "markata-notes.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.cache.accessModes | nindent 4 }}
  {{- with .Values.storage.cache.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.cache.size | quote }}
{{- end }}
