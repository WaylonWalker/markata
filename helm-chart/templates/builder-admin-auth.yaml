{{- if and .Values.builderAdmin.enabled .Values.builderAdmin.ingress.enabled .Values.builderAdmin.ingress.auth.enabled }}
{{- include "markata-notes.validateBuilderAdminAuthInternalURL" . }}
{{- $authInternalURL := .Values.builderAdmin.ingress.auth.internalUrl }}
{{- $authHeaders := list .Values.builderAdmin.auth.headers.userID .Values.builderAdmin.auth.headers.username .Values.builderAdmin.auth.headers.displayName .Values.builderAdmin.auth.headers.email .Values.builderAdmin.auth.headers.groups .Values.builderAdmin.auth.headers.roles .Values.builderAdmin.auth.headers.scopes .Values.builderAdmin.auth.headers.authMethod }}
{{- $identityHeaders := uniq (concat $authHeaders (list "X-Hlab-User-Id" "X-Hlab-Username" "X-Hlab-Display-Name" "X-Hlab-Email" "X-Hlab-Groups" "X-Hlab-Roles" "X-Hlab-Scopes" "X-Hlab-Auth-Method")) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ .Values.project_identifier }}-notes-builder-admin-strip-identity"
  namespace: "{{ include "markata-notes.namespace" . }}"
spec:
  headers:
    customRequestHeaders:
      {{- range $header := $identityHeaders }}
      {{- if $header }}
      {{ $header | quote }}: ""
      {{- end }}
      {{- end }}
      X-Markata-Builder-Admin-Forwarded: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ .Values.project_identifier }}-notes-builder-admin-forward-auth"
  namespace: "{{ include "markata-notes.namespace" . }}"
spec:
  forwardAuth:
    address: "{{ $authInternalURL | trimSuffix "/" }}{{ required "builderAdmin.ingress.auth.forwardAuthPath is required when builder-admin auth is enabled" .Values.builderAdmin.ingress.auth.forwardAuthPath }}"
    trustForwardHeader: false
    addAuthCookiesToResponse:
      {{- range .Values.builderAdmin.ingress.auth.responseCookies }}
      - {{ . | quote }}
      {{- end }}
    authResponseHeaders:
      {{- range $header := $authHeaders }}
      {{- if $header }}
      - {{ $header | quote }}
      {{- end }}
      {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ .Values.project_identifier }}-notes-builder-admin-auth"
  namespace: "{{ include "markata-notes.namespace" . }}"
spec:
  chain:
    middlewares:
      - name: "{{ .Values.project_identifier }}-notes-builder-admin-strip-identity"
      - name: "{{ .Values.project_identifier }}-notes-builder-admin-forward-auth"
{{- end }}
