{{- $corsEnabled := dig "cors" "enabled" true .Values.site }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.project_identifier }}-notes-nginx-config"
  namespace: "{{ include "markata-notes.namespace" . }}"
  labels:
    {{- include "markata-notes.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

      access_log /var/log/nginx/access.log main;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      client_max_body_size 20M;
      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 6;
      gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html/current;

        # Retained releases are private previews. The matching Ingress applies
        # builder-admin's ForwardAuth middleware before requests reach nginx.
        location ~ ^/__preview/(?<preview_release>[A-Za-z0-9._-]+)(?<preview_path>/.*)?$ {
          {{- if .Values.site.use404Page }}
          # Do not send protected preview misses through the public 404 page.
          error_page 404 = @preview_not_found;
          {{- end }}
          if ($preview_path = "") { return 302 /__preview/$preview_release/; }
          root /usr/share/nginx/html;
          rewrite ^/__preview/[A-Za-z0-9._-]+/(.*)$ /releases/$preview_release/$1 break;
          sub_filter_once off;
          sub_filter_types text/html;
          sub_filter 'href="/' 'href="/__preview/$preview_release/';
          sub_filter 'src="/' 'src="/__preview/$preview_release/';
          # Resolve directory indexes before exact files. A bare directory match
          # can trigger an internal redirect into the public /releases tree.
          try_files $uri/index.html @preview_file;
        }

        location @preview_file {
          root /usr/share/nginx/html;
          sub_filter_once off;
          sub_filter_types text/html;
          sub_filter 'href="/' 'href="/__preview/$preview_release/';
          sub_filter 'src="/' 'src="/__preview/$preview_release/';
          {{- if .Values.site.use404Page }}
          error_page 404 = @preview_not_found;
          {{- end }}
          if (-d $request_filename) { return 404; }
          try_files $uri $uri.html =404;
        }

        {{- if .Values.site.use404Page }}
        location @preview_not_found {
          return 404;
        }
        {{- end }}

        {{- if .Values.site.use404Page }}
        error_page 404 /404.html;

        location = /404.html {
          internal;
          {{- if $corsEnabled }}
          add_header Access-Control-Allow-Origin "*" always;
          {{- end }}
        }
        {{- end }}

        location / {
          {{- if $corsEnabled }}
          add_header Access-Control-Allow-Origin "*" always;
          {{- end }}
          {{- if .Values.site.use404Page }}
          try_files $uri $uri/ $uri.html =404;
          {{- else }}
          try_files $uri $uri/ /index.html =404;
          {{- end }}
        }

        {{- if .Values.site.contentIndexPath }}
        {{- if not (regexMatch "^/[A-Za-z0-9._/-]+$" .Values.site.contentIndexPath) }}{{ fail "site.contentIndexPath must be an absolute URL path containing only letters, numbers, '.', '_', '-', or '/'" }}{{ end }}
        # Keep the configured Content Index path strict. Missing metadata must
        # return 404 instead of the generic HTML fallback.
        location = {{ .Values.site.contentIndexPath }} {
          {{- if $corsEnabled }}
          add_header Access-Control-Allow-Origin "*" always;
          {{- end }}
          try_files $uri =404;
        }
        {{- end }}

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|avif|webp)$ {
          expires 365d;
          add_header Cache-Control "public, immutable";
          {{- if $corsEnabled }}
          add_header Access-Control-Allow-Origin "*" always;
          {{- end }}
        }

        location ~* \.html?$ {
          {{- if .Values.site.cacheHtmlAtEdge }}
          expires off;
          add_header Cache-Control "public, max-age=0, s-maxage=60";
          {{- else }}
          expires -1;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          {{- end }}
          {{- if $corsEnabled }}
          add_header Access-Control-Allow-Origin "*" always;
          {{- end }}
        }
      }
    }
