project_identifier: example
project_name: example
environment: prod

# Public Markata images do not require registry credentials. Add secrets here
# only when your environment mirrors or overrides them with a private registry.
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

nodeSelector: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

siteSecurityContext:
  allowPrivilegeEscalation: false

searchSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true

offline:
  enabled: true
  bundledAssetsCacheDir: /usr/local/share/markata-go/assets-cache
  bundledMermaidDir: /usr/local/share/markata-go/mermaid

build:
  enabled: true
  schedule: "02 23 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  ttlSecondsAfterFinished: 259200
  activeDeadlineSeconds: 1800
  # Keep public scheduled builds accurate by default. Enable only for preview-style loops.
  fast: false
  notify:
    enabled: false
    url: ""
  mermaid:
    mode: client
  lock:
    enabled: true
    dirName: ".markata-notes-build-lock"
    pollIntervalSeconds: 2
    staleAfterBufferSeconds: 600
  releases:
    keep: 3
  fetchImage:
    name: ghcr.io/waylonwalker/markata-go-builder
    tag: "latest"
    pullPolicy: IfNotPresent
  builderImage:
    name: ghcr.io/waylonwalker/markata-go-builder
    tag: "latest"
    pullPolicy: IfNotPresent
  proxy:
    http: ""
    https: ""
  cacheDir: /data/site/.cache/xdg
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 2Gi
      ephemeral-storage: 4Gi

builderAdmin:
  enabled: false
  host: 0.0.0.0
  port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  watch:
    enabled: true
    debounce: 2s
  # Build immediately on rollout when the executable's embedded commit differs
  # from the last successful published build. Only the active leader enqueues.
  buildOnStartupRevisionChange: true
  # Queued builder-admin builds default to full builds so blogroll, mentions, and other
  # user-facing outputs stay live unless an environment explicitly opts into faster previews.
  fast: false
  # Experimental: route queued builds through the serial DAG executor. Keep false
  # until Build Lab and production canaries have established output equivalence.
  dag: false
  mermaidMode: client
  releases:
    keep: 25
  history:
    successfulBuilds: 60
    failedBuilds: 100
    refreshRuns: 100
  buildTimeoutSeconds: 7200
  historyDir: /data/site/.builder-admin
  # Optional transient workspace for build output. Disabled preserves the
  # historical /data/site/.build-work behavior. emptyDir is useful when the
  # durable site volume is slower for small-file writes.
  workspace:
    enabled: false
    mode: emptyDir
    mountPath: /data/work
    workDir: /data/work/build
    emptyDir: {}
    hostPath:
      path: ""
      type: DirectoryOrCreate
  webhook:
    enabled: false
    branch: main
    # Required when webhook.enabled. The secret is injected as
    # MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET and is never placed in args.
    existingSecretName: ""
    existingSecretKey: webhook-secret
  # Builder admin is fail-closed: only source addresses in this list may supply
  # the identity headers injected by the protected Traefik route.
  auth:
    trustedProxyCIDRs: []
    # These must match the ForwardAuth response headers configured below. The
    # defaults preserve hlab-auth; Authentik and other providers can override them.
    headers:
      userID: X-Hlab-User-Id
      username: X-Hlab-Username
      displayName: X-Hlab-Display-Name
      email: X-Hlab-Email
      groups: X-Hlab-Groups
      roles: X-Hlab-Roles
      scopes: X-Hlab-Scopes
      # Set only when the ForwardAuth provider returns a trusted auth-method
      # assertion for validated bearer-token requests.
      authMethod: X-Hlab-Auth-Method
  ingress:
    enabled: false
    host: ""
    ingressClassName: ""
    tls:
      enabled: false
      secretName: ""
    auth:
      enabled: false
      # Use an HTTPS auth origin or a cluster-local service base URL. The chart
      # appends forwardAuthPath.
      internalUrl: ""
      forwardAuthPath: /api/v1/forward-auth
      responseCookies:
        - __Host-hlab-app-session
      # Optional browser-reachable hlab-auth origin used only to display the
      # signed-in operator's own profile picture. It does not affect login,
      # session, or WebAuthn behavior.
      publicAuthOrigin: ""
  networkPolicy:
    # Must be explicitly enabled with ingress; it limits builderAdmin.port to
    # Traefik and builder-admin peers only.
    enabled: false
    traefikNamespace: kube-system
    traefikNamespaceSelector:
      kubernetes.io/metadata.name: kube-system
    traefikPodSelector:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-kube-system
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 500Mi
    limits:
      memory: 1Gi
      ephemeral-storage: 2Gi
  refreshTasks: []

site:
  replicaCount: 1
  image:
    name: nginx
    tag: "1.27.5-alpine"
    pullPolicy: IfNotPresent
  use404Page: false
  # HTTP path that must return a successful response before the site is ready.
  healthPath: /
  cors:
    # Allow browser code on any origin to read all public site responses.
    # Protected release previews do not receive this header.
    enabled: true
  # Keep this public metadata path strict so a missing artifact returns 404.
  # Set this to an empty string to disable the exact location.
  contentIndexPath: /content-index.json
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
      ephemeral-storage: 500Mi
    limits:
      memory: 1Gi
      ephemeral-storage: 1Gi

search:
  enabled: true
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  configPath: /data/source/markata-go.toml
  image:
    name: ghcr.io/waylonwalker/markata-go-builder
    tag: "latest"
    pullPolicy: IfNotPresent
  mode: watch-content
  localCache:
    # Mount pod-local cache storage at /data/cache for source-root cache symlinks.
    enabled: false
  writableIndexStorage:
    mode: emptyDir
  port: 3001
  watchDebounce: 2s
  waitForSource:
    # Gate source-backed search and builder-admin startup until the source
    # population job writes its completion marker. This is independent of the
    # scheduled build CronJob, so it also works when build.enabled is false.
    enabled: true
    timeoutSeconds: 900
    pollIntervalSeconds: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 500Mi
    limits:
      memory: 1Gi
      ephemeral-storage: 1Gi
  extraEnv: []

sourceArchive:
  bucket: "example-bucket"
  location: "/example-share/outputs/example"
  key: "source.tar.gz"
  encryption:
    enabled: false

markataEncryption:
  secretName: "markata-go-encryption"
  sealedSecret:
    enabled: false
    encryptedData:
      MARKATA_GO_ENCRYPTION_KEY_DEFAULT: ""

aws:
  existingSecretName: aws-default
  sealedSecret:
    enabled: false
    encryptedData: {}

storage:
  source:
    mode: pvc
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteMany
    pvcNameSuffix: ""
    hostPath:
      path: ""
      type: Directory
  site:
    mode: pvc
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
    size: 10Gi
    # Set only when binding a retained, pre-existing PV with copied site data.
    volumeName: ""
    accessModes:
      - ReadWriteMany
    pvcNameSuffix: ""
    hostPath:
      path: ""
      type: DirectoryOrCreate
  search:
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    pvcNameSuffix: ""
  cache:
    enabled: false
    mode: pvc
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    pvcNameSuffix: ""
    mountPath: /data/cache
    hostPath:
      path: ""
      type: DirectoryOrCreate

ingress:
  enabled: true
  host: ""
  ingressClassName: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
  extraCnames: []
  searchPath: /api/search
  auth:
    enabled: false
    provider: traefik
    mode: redirect
    url: ""
    internalUrl: ""
    access: authenticated
    roleName: ""
    responseHeaders:
      - Remote-User
      - Remote-Email
      - Remote-Name
      - Remote-Roles
